<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逍遥仙 · 修仙武侠 Demo</title>
<style>
/* style.css — 全部样式，由 index.html 拆分而来 */
  :root { --line:#B4B2A9; --ink:#2C2C2A; --mut:#5F5E5A; --blue:#185FA5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F1EFE8; color: var(--ink);
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--mut); margin: 0 0 16px; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #E9E4D8; border: 0.5px solid var(--line); border-radius: 12px;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .bar { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; font-size: 13px; padding: 10px 0; cursor: pointer;
    background: #fff; border: 0.5px solid var(--line); border-radius: 8px; color: var(--ink);
  }
  button:hover:not(:disabled) { border-color: var(--blue); }
  button:disabled { opacity: 0.4; cursor: default; }
  .hint { font-size: 12px; color: var(--mut); margin-top: 12px; line-height: 1.6; }
  .hint b { color: var(--ink); font-weight: 500; }
  /* 在线层 UI */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .topbar .ob-actions { display: flex; gap: 8px; }
  .topbar button { flex: 0 0 auto; padding: 6px 12px; font-size: 12px; }
  .modal { position: fixed; inset: 0; background: rgba(44,44,42,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal[hidden] { display: none; }
  .modal-box { background: #1a1a1e; border-radius: 14px; padding: 22px 28px; width: min(500px, 94vw); max-height: 88vh; overflow-y: auto; box-shadow: 0 16px 60px rgba(0,0,0,0.45); color: #F1EFE8; }
  .modal-box h3 { margin: 0 0 10px; font-size: 17px; font-weight: 600; color: #F1EFE8; }
  .modal-box label { display: block; font-size: 13px; margin: 10px 0; }
  .modal-box input, .modal-box select { width: 100%; margin-top: 4px; padding: 8px; border: 0.5px solid var(--line); border-radius: 6px; font-size: 13px; background:#222;color:#eee; }
  /* 全宽按钮只针对关闭/确认类按钮，不影响 .alloc-btn 小方钮 */
  .modal-box .btn-full { width: 100%; margin-top: 14px; padding: 11px; background: var(--blue); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight:600; }
  .modal-box ol.board { padding-left: 20px; font-size: 13px; line-height: 1.9; max-height: 50vh; overflow: auto; }
  .modal-box p { font-size: 13px; line-height: 1.7; color: rgba(241,239,232,0.8); }
  .modal-box hr { border:none;border-top:1px solid rgba(255,255,255,0.08);margin:12px 0; }
  .alloc-btn { width: 22px; height: 22px; margin: 0 1px; padding: 0; background: #2a6fd9; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 700; line-height: 22px; display:inline-flex;align-items:center;justify-content:center;flex-shrink:0; }
  .alloc-btn:hover:not(:disabled) { background: #3b82f6; }
  .alloc-btn:disabled { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.2); cursor: default; }

  /* 经验进度条 */
  .xp-bar-wrap { margin: 10px 0 4px; }
  .xp-bar-info { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:4px; }
  .xp-bar-info .cur-realm { font-weight:700; color:#D4A843; font-size:13px; }
  .xp-bar-info .xp-nums { color:rgba(241,239,232,0.55); font-size:11px; }
  .xp-bar-track { width:100%; height:10px; background:rgba(255,255,255,0.08); border-radius:5px; overflow:hidden; }
  .xp-bar-fill { height:100%; background:linear-gradient(90deg,#D4A843,#f0c060); border-radius:5px; transition:width 0.4s ease; }

  /* ===== 角色创建界面 ===== */
  #create-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #111; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #create-screen[hidden] { display: none; }
  #create-bg {
    position: absolute; inset: 0;
    background: url('assets/select/bg_login.jpg') center/cover no-repeat;
    filter: brightness(0.55);
  }
  #create-panel {
    position: relative; z-index: 1;
    width: min(680px, 92vw); max-height: 90vh; overflow-y: auto;
    background: rgba(20,20,18,0.72);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 32px 28px 24px;
    color: #F1EFE8;
  }
  #create-panel h2 {
    margin: 0 0 4px; font-size: 22px; font-weight: 600;
    text-align: center; letter-spacing: 2px;
  }
  #create-panel .create-sub {
    text-align: center; font-size: 13px; color: rgba(241,239,232,0.55);
    margin: 0 0 24px;
  }
  .create-step { display: none; }
  .create-step.active { display: block; }

  /* Step 1: 名字输入 */
  .name-input-wrap { margin-top: 8px; }
  .name-input-wrap input {
    width: 100%; padding: 14px 16px; font-size: 18px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px; color: #fff; outline: none; text-align: center;
    letter-spacing: 1px;
  }
  .name-input-wrap input:focus { border-color: rgba(135,180,235,0.7); }
  .name-input-wrap input::placeholder { color: rgba(255,255,255,0.3); }
  .name-err { font-size: 12px; color: #E87B7B; margin-top: 6px; text-align: center; min-height: 18px; }
  .name-hint { font-size: 12px; color: rgba(241,239,232,0.45); margin-top: 8px; text-align: center; }

  /* Step 2: 性别选择 */
  .gender-row { display: flex; gap: 16px; justify-content: center; margin-top: 12px; }
  .gender-card {
    width: 160px; padding: 24px 12px; text-align: center;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; cursor: pointer; transition: all 0.2s;
  }
  .gender-card:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
  .gender-card.selected { background: rgba(24,143,165,0.2); border-color: #185FA5; box-shadow: 0 0 20px rgba(24,143,165,0.15); }
  .gender-icon { font-size: 36px; margin-bottom: 8px; }
  .gender-label { font-size: 16px; font-weight: 500; }

  /* Step 3: 形象选择 */
  .char-grid { display: flex; gap: 14px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .char-card {
    width: 175px; text-align: center;
    background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px; cursor: pointer; transition: all 0.2s; overflow: hidden;
  }
  .char-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.3); }
  .char-card.selected { border-color: #D4A843; box-shadow: 0 0 22px rgba(212,168,67,0.2); transform: translateY(-3px); }
  .char-card img { width: 100%; height: 260px; object-fit: cover; object-position: top center; display: block; }
  .char-name { font-size: 13px; padding: 8px 4px 10px; font-weight: 500; color: rgba(241,239,232,0.85); }

  /* 公共按钮 */
  .create-btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
  .create-btn-row button {
    padding: 11px 32px; font-size: 14px; border-radius: 10px; cursor: pointer;
    border: none; font-weight: 500; transition: all 0.15s;
  }
  .btn-primary { background: linear-gradient(135deg,#185FA5,#124a82); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg,#1d6fc0,#155a96); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: rgba(241,239,232,0.8); border: 1px solid rgba(255,255,255,0.15); }
  .btn-secondary:hover { background: rgba(255,255,255,0.16); }
  button:disabled { opacity: 0.35; cursor: default; }

  /* 步骤指示器 */
  .step-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .step-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.25s; }
  .step-dot.active { background: #185FA5; box-shadow: 0 0 8px rgba(24,143,165,0.5); }
  .step-dot.done { background: #639922; }

  /* ===== 游戏主页（人物展示 + 顶部菜单栏） ===== */
  #hub-screen {
    position: fixed; inset: 0; z-index: 90;
    display: flex; flex-direction: column;
    background: #0a0a0c; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #F1EFE8; overflow: hidden;
  }
  #hub-screen[hidden] { display: none; }

  /* 顶部信息+菜单栏 */
  .hub-topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px 6px;
    background: linear-gradient(180deg, rgba(20,18,16,0.95), rgba(20,18,16,0.85));
    border-bottom: 0.5px solid rgba(212,168,67,0.2);
    flex-shrink: 0;
    min-height: 52px;
  }
  /* 头像区 */
  .hub-avatar-wrap {
    position: relative; width: 42px; height: 42px; flex-shrink: 0;
  }
  .hub-avatar-frame {
    position: absolute; inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: linear-gradient(135deg, #D4A843, #8B6914, #D4A843) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
  }
  .hub-avatar-img {
    width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid rgba(212,168,67,0.5);
  }
  /* 名字 */
  .hub-name {
    font-size: 15px; font-weight: 600; color: #F1EFE8;
    min-width: 70px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: 1px;
  }
  /* 战力 */
  .hub-power {
    display: flex; align-items: baseline; gap: 2px;
    font-size: 12px; color: rgba(241,239,232,0.6);
    min-width: 72px;
  }
  .hub-power-num {
    font-size: 16px; font-weight: 700; color: #E87B7B;
    text-shadow: 0 0 8px rgba(232,123,123,0.3);
  }
  /* 境界 */
  .hub-realm {
    font-size: 12px; font-weight: 600; color: #9B6BCC;
    white-space: nowrap; letter-spacing: 0.5px;
    padding: 2px 6px;
    background: rgba(155,107,204,0.1);
    border-radius: 4px;
    border: 0.5px solid rgba(155,107,204,0.25);
  }
  /* 菜单按钮容器 */
  .hub-menu {
    display: flex; gap: 4px;
    flex-wrap: nowrap; overflow-x: auto;
  }
  .hub-menu::-webkit-scrollbar { display: none; }
  .hub-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 5px 7px; min-width: 52px;
    background: rgba(255,255,255,0.06); border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 8px; cursor: pointer; transition: all 0.15s; color: rgba(241,239,232,0.8);
    flex-shrink: 0;
  }
  .hub-btn:hover { background: rgba(24,143,165,0.15); border-color: rgba(24,143,165,0.4); color: #fff; transform: translateY(-1px); }
  .hub-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .hub-btn span { font-size: 10.5px; white-space: nowrap; line-height: 1.1; }

  /* 中央人物动图区域 */
  .hub-char-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, rgba(30,25,40,0.9) 0%, rgba(10,10,12,1) 70%);
  }
  .hub-char-video {
    max-height: 85%; max-width: 75%;
    object-fit: contain;
    filter: drop-shadow(0 0 30px rgba(212,168,67,0.08));
  }
  /* 视频不存在时用静态图 */
  .hub-char-static {
    max-height: 80%; max-width: 65%;
    object-fit: contain;
    filter: drop-shadow(0 0 30px rgba(212,168,67,0.08));
  }
  /* 底部提示 */
  .hub-footer {
    text-align: center; font-size: 11px; color: rgba(241,239,232,0.3);
    padding: 6px; flex-shrink: 0;
  }

  /* 主页弹窗复用 modal 样式 */
  .hub-modal-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .hub-modal-title svg { width: 22px; height: 22px; flex-shrink: 0; }

  /* ===== 装备弹窗 ===== */
  .equip-sec-title { font-size: 13px; color: #D4A843; font-weight: 600; margin: 4px 0 8px; }
  .equip-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .equip-slot { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; }
  .equip-slot-head { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(241,239,232,0.7); font-weight: 600; margin-bottom: 6px; }
  .equip-icon { font-size: 16px; }
  .equip-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .equip-bonus { font-size: 11px; color: rgba(241,239,232,0.55); line-height: 1.5; margin-bottom: 6px; word-break: break-all; }
  .equip-btn { width: auto; min-width: 48px; padding: 0 12px; height: 26px; font-size: 12px; font-weight: 600; background: #2a6fd9; color: #fff; border: none; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
  .equip-btn:hover { background: #3b82f6; }
  .equip-btn.danger { background: rgba(232,123,123,0.2); color: #E87B7B; }
  .equip-btn.danger:hover { background: rgba(232,123,123,0.32); }
  .bag-list { display: flex; flex-direction: column; gap: 8px; }
  .bag-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 10px; }
  .bag-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .bag-name { font-size: 13px; font-weight: 600; }
  .forge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .forge-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; font-size: 13px; font-weight: 600; background: rgba(212,168,67,0.1); border: 1px solid rgba(212,168,67,0.3); border-radius: 8px; color: #F1EFE8; cursor: pointer; }
  .forge-btn:hover { background: rgba(212,168,67,0.2); }
  .forge-cost { font-size: 11px; font-weight: 400; color: rgba(241,239,232,0.5); }

</style>
</head>
<body>
<div class="wrap">
  <div id="online-root"></div>
  <h1>逍遥仙 · 修仙武侠 Demo</h1>
  <p class="sub">节点地图探索 + 一场回合制战斗（纯 HTML5 Canvas，零依赖）</p>

  <div class="stage">
    <canvas id="game" width="640" height="360"></canvas>
  </div>

  <div class="bar" id="cmd">
    <button data-act="attack">攻击</button>
    <button data-act="skill">武功</button>
    <button data-act="defend">防御</button>
    <button data-act="item">道具</button>
  </div>

  <p class="hint">
    <b>操作：</b>地图上点击发亮（蓝色）的地点进入战斗；战斗中轮到「你的回合」时点下方指令。
    <b>美术替换：</b>把即梦生成的立绘放进 <code>assets/</code> 目录，
    命名为 <code>hero.png</code>（我方）、<code>enemy.png</code>（敌方）、<code>bg_battle.png</code>（战斗背景）即可自动生效，未放入时显示占位图。
  </p>
</div>

<!-- ===== 角色创建界面 ===== -->
<div id="create-screen">
  <div id="create-bg"></div>
  <div id="create-panel">
    <h2>✦ 逍遥仙 ✦</h2>
    <p class="create-sub">踏入仙途，开启你的修真之旅</p>

    <div class="step-dots">
      <div class="step-dot active" data-s="0"></div>
      <div class="step-dot" data-s="1"></div>
      <div class="step-dot" data-s="2"></div>
    </div>

    <!-- Step 1: 名字 -->
    <div class="create-step active" id="step-name">
      <p style="text-align:center;font-size:14px;color:rgba(241,239,232,0.75);margin-bottom:4px;">为你的侠客起一个名号</p>
      <div class="name-input-wrap">
        <input type="text" id="char-name" placeholder="输入角色名（仅限汉字或字母）" maxlength="12" autocomplete="off">
        <div class="name-err" id="name-err"></div>
      </div>
      <p class="name-hint">名号将伴随你的整个江湖旅程，不可更改</p>
      <div class="create-btn-row"><button class="btn-primary" id="name-next" disabled>下一步</button></div>
    </div>

    <!-- Step 2: 性别 -->
    <div class="create-step" id="step-gender">
      <p style="text-align:center;font-size:14px;color:rgba(241,239,232,0.75);margin-bottom:4px;">选择性别</p>
      <div class="gender-row">
        <div class="gender-card" data-g="male">
          <div class="gender-icon">♂</div>
          <div class="gender-label">男</div>
        </div>
        <div class="gender-card" data-g="female">
          <div class="gender-icon">♀</div>
          <div class="gender-label">女</div>
        </div>
      </div>
      <div class="create-btn-row">
        <button class="btn-secondary" id="gender-back">上一步</button>
        <button class="btn-primary" id="gender-next" disabled>下一步</button>
      </div>
    </div>

    <!-- Step 3: 形象 -->
    <div class="create-step" id="step-avatar">
      <p style="text-align:center;font-size:14px;color:rgba(241,239,232,0.75);margin-bottom:4px;" id="avatar-hint">选择你的形象</p>
      <div class="char-grid" id="char-grid"></div>
      <div class="create-btn-row">
        <button class="btn-secondary" id="avatar-back">上一步</button>
        <button class="btn-primary" id="avatar-confirm" disabled>开始闯荡</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 游戏主页（人物展示 + 菜单栏） ===== -->
<div id="hub-screen" hidden>
  <!-- 顶部菜单栏 -->
  <div class="hub-topbar">
    <!-- 头像 -->
    <div class="hub-avatar-wrap">
      <div class="hub-avatar-frame"></div>
      <img class="hub-avatar-img" id="hub-avatar" src="" alt="">
    </div>
    <!-- 名字 -->
    <div class="hub-name" id="hub-name">逍遥仙</div>
    <!-- 战力 -->
    <div class="hub-power">
      战力<span class="hub-power-num" id="hub-power-num">1,234</span>
    </div>
    <!-- 境界 -->
    <div class="hub-realm" id="hub-realm"></div>
    <!-- 经验进度条 -->
    <div class="xp-bar-wrap" id="hub-xp-bar" style="max-width:140px;flex-shrink:0">
      <div class="xp-bar-track" style="height:6px;border-radius:3px"><div class="xp-bar-fill" id="hub-xp-fill" style="width:0%;height:100%;border-radius:3px"></div></div>
      <div class="xp-bar-info" style="margin-top:1px">
        <span class="cur-realm" id="hub-xp-realm" style="font-size:10px;color:#9B6BCC"></span>
        <span class="xp-nums" id="hub-xp-nums" style="font-size:9px"></span>
      </div>
    </div>
    <!-- 功能按钮 -->
    <div class="hub-menu" id="hub-menu"></div>
  </div>

  <!-- 中央人物动图区 -->
  <div class="hub-char-area" id="hub-char-area">
    <!-- 有视频时用 video，没有时用 img 静态立绘 -->
    <video class="hub-char-video" id="hub-char-video" autoplay loop muted playsinline hidden></video>
    <img class="hub-char-static" id="hub-char-static" src="" alt="">
  </div>

  <!-- 底部 -->
  <div class="hub-footer">点击上方按钮开始你的修仙之旅</div>
</div>

<!-- 全局弹窗（离线/在线通用） -->
<div class="modal" id="modal" hidden>
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- tcb.js 离线模式不需要，已省略 -->
<script>
// CloudBase 环境 ID：把你在腾讯云开发控制台拿到的环境 ID 填到引号里。
// 留空（""）则游戏以单机模式运行，不联网、不出现登录/排行榜界面。
window.CLOUDBASE_ENV = "";

</script>
<script>
/* 修炼境界体系 — 数据 + 纯计算（无 DOM 依赖）
 * 用法：
 *   const r = CULTIVATION.realmFromXp(player.xp);
 *   r.label        -> "炼气境 第三重天"
 *   r.progress     -> 0~1，当前小阶的进度
 *   r.realmName / r.stageName
 *   r.nextLabel    -> 下一小阶名称（已到顶则为 null）
 *   CULTIVATION.recalc(player) -> 按 xp 刷新 maxHp/atk/def/maxMp 派生属性
 * 经验曲线：每升一小阶所需修为随境界递增（见 STAGE_XP_*），后期突破越来越难。
 */
const CULTIVATION = (function () {
  const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const list = (name, ...stages) => ({ name, stages });
  const nine = name => list(name, ...CN.map(n => `第${n}重天`));   // 1~9 重天
  const nineJie = name => list(name, ...CN.map(n => `第${n}阶`));  // 1~9 阶
  const four = name => list(name, '前期', '中期', '后期', '圆满'); // 前期/中期/后期/圆满

  // 用户给定的完整境界阶梯（顺序即由低到高）
  const REALMS = [
    nine('炼气境'), nine('筑基境'), nine('真武境'), nine('化海境'),
    nine('金丹境'), nine('元婴境'), nine('出窍境'), nine('破虚境'),
    four('渡劫境'), four('超脱境'),
    four('人仙'), four('地仙'), four('天仙'), four('真仙'), four('金仙'), four('玄仙'), four('仙君'), four('仙帝'),
    list('圣境', '圣君', '圣主', '圣尊'),
    nine('虚神境'), nine('真神境'),
    list('神王境', '不朽神王', '永恒神王', '道祖神王'),
    nineJie('混沌境'),
    // 主宰：用户原话“初阶至高阶”，按常见四阶（初阶/中阶/高阶/巅峰）处理，如需调整告知我
    list('主宰', '初阶', '中阶', '高阶', '巅峰'),
    nine('宇宙神'),
    four('宇宙国主'),
  ];

  // 扁平化小阶列表（真正用于进度计算）
  const FLAT = [];
  REALMS.forEach((realm, ri) => {
    realm.stages.forEach(stage => {
      FLAT.push({ realmIndex: ri, realmName: realm.name, stageName: stage, label: realm.name + ' ' + stage });
    });
  });

  // 每升一小阶所需修为：随境界序号 i（0 起）递增，让后期突破越来越难。
  //   req(i) = BASE + STEP·i + QUAD·i²    （线性增长 + 二次加速）
  // 调参：BASE 抬高整体门槛；STEP 控制线性斜率；QUAD 控制后期陡峭程度。
  // 设计目标（挂机节奏）：在线 2/s、离线 1/s 封顶 12h/天。
  //   满级总修为≈3724万 → 肝帝(在线8h/天)≈1.01年、重度(在线2h)≈1.77年、休闲(在线1h)≈2.02年、纯离线≈2.36年。
  //   即"至少玩一年才到顶"，且越往后单阶越久（第1阶≈2分钟，末阶≈5600分钟在线）。
  const STAGE_XP_BASE = 200;  // 第 1 小阶所需修为（≈2分钟在线，前期即有"修炼感"）
  const STAGE_XP_STEP = 20;   // 每升一阶线性 +20
  const STAGE_XP_QUAD = 24;   // 二次项，越往后越陡（主导后期拉长）
  function stageXpReq(i) {
    return Math.round(STAGE_XP_BASE + STAGE_XP_STEP * i + STAGE_XP_QUAD * i * i);
  }
  // 预计算累计阈值：CUM[i] = 进入第 i 小阶需要累计的总修为
  const CUM = [0];
  for (let i = 1; i <= FLAT.length; i++) CUM[i] = CUM[i - 1] + stageXpReq(i - 1);

  function realmFromXp(xp) {
    const total = FLAT.length;
    xp = xp || 0;
    // 二分查找最大 idx 使 CUM[idx] <= xp
    let lo = 0, hi = total - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (CUM[mid] <= xp) lo = mid; else hi = mid - 1;
    }
    const idx = lo;
    const req = stageXpReq(idx);
    const into = xp - CUM[idx];           // 当前小阶已攒修为
    const within = Math.min(1, req > 0 ? into / req : 1);
    const stage = FLAT[idx];
    const next = idx + 1 < total ? FLAT[idx + 1] : null;
    return {
      globalIndex: idx,
      realmIndex: stage.realmIndex,
      realmName: stage.realmName,
      stageName: stage.stageName,
      label: stage.label,
      progress: within,
      xpIntoStage: into,
      xpForStage: req,
      totalXp: xp,
      nextLabel: next ? next.label : null,
      isMax: idx === total - 1,
    };
  }

  // 依据 xp 刷新派生属性（基础值 + 每小阶加成），让境界越高越强
  const BASE = { maxHp: 150, atk: 30, def: 12, maxMp: 60 };
  function recalc(p) {
    const idx = realmFromXp(p.xp).globalIndex;
    p.maxHp = BASE.maxHp + idx * 4;
    p.atk   = BASE.atk   + idx * 1;
    p.def   = BASE.def   + idx * 0.5;
    p.maxMp = BASE.maxMp + idx * 1;
    return p;
  }

  return {
    REALMS, FLAT,
    STAGE_XP_BASE, STAGE_XP_STEP, STAGE_XP_QUAD,
    stageXpReq, cumXp: i => CUM[i],
    TOTAL_STAGES: FLAT.length,
    MAX_LABEL: FLAT[FLAT.length - 1].label,
    BASE, realmFromXp, recalc,
  };
})();

</script>

<script>
/* player.js — 属性常量 + 功法表 + 挂机常量 + player 对象 + 派生属性计算
 * 由 index.html 拆分而来。加载顺序见 index.html 底部 <script> 列表，勿随意调整。
 * 注意：顶层 const/let 跨文件可直接引用，但不会挂到 window（详见 PROJECT.md 坑点 8.1）。
 */
// ---- 玩家（跨战斗保留，胜利后回血）----
// 6 项可自由加点属性（初值 10），由 recalcStats 推导全部战斗数值
const ATTR_KEYS = ['con', 'str', 'sou', 'spd', 'com', 'des'];
const ATTR_NAMES = { con: '体质', str: '力量', sou: '灵魂', spd: '速度', com: '悟性', des: '天命' };
const POINTS_PER_STAGE = 10;  // 每突破一小阶获得的可分配点数
const BASE_FREE_POINTS = 10;  // 开局即可分配的基础点数（出生即有，不用等突破）

// ===== 功法系统（装备至多 6 种，战斗中每回合点选施展）=====
// 全部功法数据在 js/skills-data.js 的 SKILLS_DB / SKILLS_DB_MAP（由 gen_skills.py 生成，130 种）。
// 普攻恒为物理（0 灵力）；功法分物理/精神/无三类，灵力消耗各由功法定（越阶越高）。
// 新角色初始赠送一套涵盖「攻/精/回灵/防御增益/回血/减益」的入门功法，保证开局即可体验多样机制。
const DEFAULT_LEARNED = ['at001', 'at022', 're015', 'bu008', 're004', 'de009', 'at002', 'bu016'];
const DEFAULT_EQUIPPED = ['at001', 'at022', 're015', 'bu008', 're004', 'de009']; // 至多 6
const MAX_EQUIPPED = 6;

// ===== 挂机修炼 =====
// 在线：停留在游戏画面（主页/地图/战斗）即按速率累加修为；离线：按离开时长结算（封顶 12 小时）
const ONLINE_XP_PER_SEC = 2;     // 在线每秒修为
const OFFLINE_XP_PER_SEC = 1;    // 离线每秒修为（约为在线一半）
const OFFLINE_CAP_SEC = 12 * 3600;
const HUB_TICK_MS = 1000;

// 加修为（fullHeal=true 时回满，用于离线结算/突破）
function gainXp(amount, fullHeal) {
  player.xp += amount;
  recalcStats(player);
  if (fullHeal) { player.hp = player.maxHp; player.mp = player.maxMp; }
  else { player.hp = Math.min(player.hp, player.maxHp); player.mp = Math.min(player.mp, player.maxMp); }
}

// 离线挂机结算：返回获得的修为（0 表示无）
function applyOfflineXp() {
  if (!player.lastSeen) return 0;
  const elapsed = Math.min(OFFLINE_CAP_SEC, Math.max(0, (Date.now() - player.lastSeen) / 1000));
  const gain = Math.floor(elapsed * OFFLINE_XP_PER_SEC * (1 + player.xpBonus));
  if (gain > 0) gainXp(gain, true);
  return gain;
}

// ===== 装备系统 =====
// 4 个装备部位：武器/护甲/法宝/战靴，每个部位主加不同派生属性
const EQUIP_SLOTS = {
  weapon:    { name: '武器', icon: '⚔', attrs: ['atk', 'spiAtk'] },
  armor:     { name: '护甲', icon: '🛡', attrs: ['def', 'spiDef', 'maxHp'] },
  accessory: { name: '法宝', icon: '☯', attrs: ['maxMp', 'spiAtk', 'eva'] },
  boots:     { name: '战靴', icon: '👢', attrs: ['init', 'eva'] },
};
const EQUIP_SLOT_KEYS = Object.keys(EQUIP_SLOTS);

// 品质（凡→灵→宝→仙→神）：mult 为属性放大系数，ea 为极品追加「连动」的概率
const RARITY = [
  { key: 'fan',  name: '凡品', color: '#9aa0a6', mult: 1.0, ea: 0.00 },
  { key: 'ling', name: '灵品', color: '#639922', mult: 1.5, ea: 0.05 },
  { key: 'bao',  name: '宝品', color: '#378ADD', mult: 2.2, ea: 0.12 },
  { key: 'xian', name: '仙品', color: '#9B6BCC', mult: 3.2, ea: 0.22 },
  { key: 'shen', name: '神品', color: '#D4A843', mult: 4.6, ea: 0.40 },
];

// 各属性在「凡品 / 0 阶」时的单件基准值，后续按品质与境界缩放
const EQUIP_BASE = { atk: 6, def: 5, maxHp: 45, maxMp: 35, spiAtk: 6, spiDef: 4, init: 5, eva: 0.02 };

// 部位命名素材（品质·词缀）
const _EQUIP_NAMES = {
  weapon:    ['寒铁剑', '青锋刃', '玄铁枪', '赤霄剑'],
  armor:     ['玄龟甲', '锁子铠', '霓裳衣', '玄武袍'],
  accessory: ['聚灵珠', '乾坤戒', '引魂幡', '太极符'],
  boots:     ['追风靴', '凌波履', '踏云靴', '神行靴'],
};

let _equipUid = 1;
function nextEquipUid() { return 'E' + Date.now().toString(36) + (_equipUid++); }

// 生成一件装备（slot：部位；rarityIdx：品质序号）
function genEquip(slot, rarityIdx) {
  const r = RARITY[rarityIdx];
  const def = EQUIP_SLOTS[slot];
  const tier = (typeof CULTIVATION !== 'undefined') ? CULTIVATION.realmFromXp(player.xp).globalIndex : 0;
  const scale = 1 + tier * 0.18; // 境界越高，装备数值越强
  const item = { uid: nextEquipUid(), slot, slotName: def.name, rarity: r.key, rarityName: r.name, rarityColor: r.color, bonus: {}, extraActions: 0, name: '' };
  def.attrs.forEach(a => {
    let v = Math.round(EQUIP_BASE[a] * r.mult * scale);
    if (a === 'eva') v = Math.round(EQUIP_BASE[a] * r.mult * 100) / 100; // eva 以比率增量存储（如 0.03）
    item.bonus[a] = v;
  });
  if (Math.random() < r.ea) item.extraActions = 1; // 极品：战斗额外连动一次
  const pool = _EQUIP_NAMES[slot];
  item.name = r.name + '·' + pool[Math.floor(Math.random() * pool.length)];
  return item;
}

// 锻造时的品质随机（境界越高越容易出高品）
function rollRarity() {
  const tier = (typeof CULTIVATION !== 'undefined') ? CULTIVATION.realmFromXp(player.xp).globalIndex : 0;
  const w = [
    Math.max(1, 60 - tier * 2),      // 凡
    30 + Math.min(tier, 20),         // 灵
    Math.min(15 + tier, 40),         // 宝
    Math.max(0, tier - 5) * 2,       // 仙
    Math.max(0, tier - 15),          // 神
  ];
  const sum = w.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < w.length; i++) { if ((r -= w[i]) <= 0) return i; }
  return 0;
}

// 装备加成文字（用于弹窗展示）
function equipBonusText(item) {
  const names = { atk: '攻', def: '防', maxHp: '气血', maxMp: '灵力', spiAtk: '精攻', spiDef: '精防', init: '先攻', eva: '闪避' };
  const parts = [];
  const bonus = item.bonus || {};
  for (const k in bonus) {
    if (!bonus[k]) continue;
    parts.push((names[k] || k) + (k === 'eva' ? '+' + Math.round(bonus[k] * 100) + '%' : '+' + bonus[k]));
  }
  if (item.extraActions) parts.push('连动+' + item.extraActions);
  return parts.join(' ');
}

// 新角色初始赠送一套凡品装备（自动穿戴，让装备系统开局即生效）
function applyStarterEquip() {
  const eq = {};
  EQUIP_SLOT_KEYS.forEach(s => { eq[s] = genEquip(s, 0); });
  player.equipment = eq;
  player.bag = [];
  player.gold = 50;
}

const player = {
  name: '少年侠客', isEnemy: false,
  con: 10, str: 10, sou: 10, spd: 10, com: 10, des: 10, // 6 基础属性
  spent: 0,                                                  // 已分配点数
  extraActions: 0,                                           // 极品装备附加的本回合连动次数（recalcStats 重算）
  xpBonus: 0,                                                // 挂机经验加成（比例）
  learned: DEFAULT_LEARNED.slice(),                         // 已习得功法（SKILLS_DB id 数组）
  equippedSkills: DEFAULT_EQUIPPED.slice(),                 // 已装备功法（≤6，战斗中每回合点选）
  storyCleared: {},                                         // 剧情副本进度：ch -> 已通关关卡数(0~10)
  storyRewardClaimed: {},                                   // 已领取章节通关奖励的章节号集合
  lastSeen: Date.now(),                                      // 离线时间戳（挂机结算）
  maxHp: 0, hp: 0, maxMp: 0, mp: 0, atk: 0, def: 0, spd: 0,
  spiAtk: 0, spiDef: 0, eva: 0, init: 0, luck: 0,
  potions: 3, defending: false, sect: '', score: 0, xp: 0,
  equipment: { weapon: null, armor: null, accessory: null, boots: null }, // 已穿戴装备（部位→item）
  bag: [], gold: 50,                                         // 背包 + 灵石（锻造货币）
};

// 由 6 基础属性 + 境界 + 装备 推导出全部战斗数值
function recalcStats(p) {
  const idx = (typeof CULTIVATION !== 'undefined' ? CULTIVATION.realmFromXp(p.xp) : { globalIndex: 0 }).globalIndex;
  let maxHp  = Math.round(100 + p.con * 20 + idx * 100);
  let def    = Math.round(10 + p.con * 2 + idx * 2.5);
  let atk    = Math.round(20 + p.str * 2 + idx * 8);
  let maxMp  = Math.round(100 + p.com * 20 + idx * 100);    // 灵力上限
  let spiAtk = Math.round(20 + p.sou * 2 + idx * 10);       // 精神攻击
  let spiDef = Math.round(10 + p.sou * 1 + idx * 2);        // 精神防御
  let spd    = p.spd;                                        // 速度（战斗速度=属性值）
  let init   = Math.round(10 + p.spd * 2 + idx * 2);        // 先攻值
  let eva    = 0.10 + idx * 0.001 + p.spd * 0.001 + p.des * 0.001; // 闪避率（基础）
  let extraActions = 0;

  // 装备加成：叠加到派生属性；extraActions 注入战斗连动 hook（battle.js beginRound 读取）
  const eq = p.equipment || {};
  for (const slot of EQUIP_SLOT_KEYS) {
    const it = eq[slot];
    if (!it || !it.bonus) continue;
    if (it.bonus.atk)    atk    += it.bonus.atk;
    if (it.bonus.def)    def    += it.bonus.def;
    if (it.bonus.maxHp)  maxHp  += it.bonus.maxHp;
    if (it.bonus.maxMp)  maxMp  += it.bonus.maxMp;
    if (it.bonus.spiAtk) spiAtk += it.bonus.spiAtk;
    if (it.bonus.spiDef) spiDef += it.bonus.spiDef;
    if (it.bonus.init)   init   += it.bonus.init;
    if (it.bonus.eva)    eva    += it.bonus.eva;
    if (it.extraActions) extraActions += it.extraActions;
  }

  p.maxHp = maxHp;
  p.def = def;
  p.atk = atk;
  p.maxMp = maxMp;
  p.spiAtk = spiAtk;
  p.spiDef = spiDef;
  p.spd = spd;
  p.init = Math.round(init);
  p.eva = Math.min(0.95, eva);
  p.extraActions = extraActions;
  p.luck = p.des;                                        // 幸运值
  p.xpBonus = (p.com + p.des) * 0.002;                     // 挂机经验加成 = 悟性×0.2% + 天命×0.2%（每点属性各 0.2%）
  return p;
}

recalcStats(player); // 初始化派生属性（xp=0 → 炼气境 第一重天）
player.hp = player.maxHp; player.mp = player.maxMp;

</script>
<script>
// ===== 《逍遥仙》功法数据库（由 gen_skills.py 生成，共 130 种）=====
// 名称改编自《一剑霸天》（永夜星河/番茄小说）武学词根 + 武侠通用词根，规避抄袭。
// 加载顺序：须在 battle.js / hub.js 之前 <script src> 引入本文件（提供全局 SKILLS_DB）。
// 字段说明：
//   id        唯一标识（攻击类可写入 player.equippedSkills）
//   school    类型：attack_phys/attack_spirit/defense/recover_hp/recover_mp/buff_atk/buff_spd/buff_def/debuff/special

<script>
/* battle.js — 地图节点 + 状态机 + 回合制战斗 + 输入 + Canvas 渲染
 * 由 index.html 拆分而来。加载顺序见 index.html 底部 <script> 列表，勿随意调整。
 * 注意：顶层 const/let 跨文件可直接引用，但不会挂到 window（详见 PROJECT.md 坑点 8.1）。
 */
// ---- 地图节点 ----
const nodes = [
  { id: 0, name: '清风镇',   x: 80,  y: 280, type: 'start',  cleared: true,  enemy: null },
  { id: 1, name: '黑松林',   x: 230, y: 210, type: 'battle', cleared: false, enemy: { name: '山贼头目', hp: 120, atk: 22, def: 9,  spd: 14 } },

  { id: 4, name: '毒龙潭',   x: 590, y: 110, type: 'battle', cleared: false, enemy: { name: '毒龙尊者', hp: 350,  atk: 40,  def: 18, spd: 26 } },
  { id: 5, name: '幽冥谷',   x: 560, y: 180, type: 'boss',   cleared: false, enemy: { name: '幽冥谷主', hp: 520,  atk: 52,  def: 26, spd: 30 } },
  { id: 6, name: '落魂涧',   x: 610, y: 250, type: 'battle', cleared: false, enemy: { name: '噬魂魔将', hp: 600,  atk: 58,  def: 30, spd: 34 } },
  { id: 7, name: '血河渊',   x: 550, y: 310, type: 'boss',   cleared: false, enemy: { name: '血河神君', hp: 780,  atk: 70,  def: 38, spd: 40 } },
  { id: 8, name: '白骨岭',   x: 470, y: 280, type: 'battle', cleared: false, enemy: { name: '白骨夫人', hp: 850,  atk: 76,  def: 42, spd: 44 } },
  { id: 9, name: '剑冢',     x: 400, y: 220, type: 'boss',   cleared: false, enemy: { name: '剑魔独孤', hp: 1000, atk: 90,  def: 50, spd: 52 } },
  { id: 10, name: '焚天崖',  x: 500, y: 150, type: 'battle', cleared: false, enemy: { name: '焚天火尊', hp: 1080, atk: 96,  def: 54, spd: 56 } },
  { id: 11, name: '逍遥天',  x: 610, y: 80,  type: 'boss',   cleared: false, enemy: { name: '逍遥天主', hp: 1300, atk: 110, def: 62, spd: 60 } },
];
const unlocked = id => id === 0 || nodes[id - 1].cleared;

// ---- 状态机 ----
let state = 'map';          // 'map' | 'battle' | 'win' | 'lose' | 'clear'
let battle = null;
let floats = [];            // 飘字
let toast = '';             // 底部提示
let awaitingInput = false;

function makeEnemy(node) {
  const e = node.enemy;
  return {
    name: e.name, isEnemy: true,
    maxHp: e.hp, hp: e.hp, maxMp: 40, mp: 40,
    atk: e.atk, def: e.def, spd: e.spd,
    init: Math.round(10 + e.spd * 2), eva: 0.05, spiAtk: 0, spiDef: e.def, luck: 0,
    potions: 0, defending: false, extraActions: 0,
    buffs: [], debuffs: [], shield: null, stun: 0,
    skill: { name: '敌袭', type: 'phys', mult: 1.8, cost: 10 },
  };
}

// 构建战斗指令栏：普攻 + 已装备功法（≤6）+ 防御 + 道具
function buildSkillBar() {
  const skills = (player.equippedSkills || []).map(id => SKILLS_DB_MAP[id]).filter(Boolean);
  let html = '<button data-act="attack">攻击</button>';
  skills.forEach(s => {
    html += `<button data-act="skill" data-skill="${s.id}" data-cost="${s.cost}" title="${esc(s.desc)}">${esc(s.name)}<small style="opacity:.7"> ${s.cost}灵</small></button>`;
  });
  html += '<button data-act="defend">防御</button><button data-act="item">道具</button>';
  cmdBar.innerHTML = html;
}

function startBattle(node, mode) {
  const enemy = makeEnemy(node);
  // 重置玩家本场战斗的临时状态（buff/debuff/护盾/僵直），避免跨场残留
  player.buffs = []; player.debuffs = []; player.shield = null; player.stun = 0;
  battle = {
    node, player, enemy,
    mode: mode || 'map',          // 'map' = 江湖节点；'story' = 剧情副本
    queue: [], turn: 0,
    msg: '遭遇 ' + enemy.name + '！',
  };
  state = 'battle';
  toast = '';
  buildSkillBar();
  beginRound();
}

// 状态乘区：buff 加成（amt 为比例，1 即 +0%）、debuff 削减（下限 0）
function buffMul(u, stat) { let m = 1; (u.buffs || []).forEach(b => { if (b.stat === stat) m += b.amt; }); return m; }
function debuffMul(u, stat) { let m = 1; (u.debuffs || []).forEach(b => { if (b.stat === stat) m -= b.amt; }); return Math.max(0, m); }
// 回合开始：衰减 buff/debuff/shield 持续时间（stun 在下面单独处理）
function tickDurations(u) {
  if (u.buffs) u.buffs = u.buffs.filter(b => (b.dur -= 1) > 0);
  if (u.debuffs) u.debuffs = u.debuffs.filter(b => (b.dur -= 1) > 0);
  if (u.shield && (u.shield.dur -= 1) <= 0) u.shield = null;
}

function beginRound() {
  const p = battle.player, e = battle.enemy;
  // 每回合开始小幅回内力，清掉上一轮防御
  [p, e].forEach(u => { if (u.hp > 0) { u.mp = Math.min(u.maxMp, u.mp + 5); u.defending = false; } });
  // 衰减 buff/debuff/shield 持续时间
  [p, e].forEach(tickDurations);
  // 僵直（stun）：本回合无法行动，并递减
  const pStun = (p.stun || 0) > 0, eStun = (e.stun || 0) > 0;
  if (pStun) p.stun--;
  if (eStun) e.stun--;
  const alive = [p, e].filter(u => u.hp > 0 && !(u === p ? pStun : eStun));
  let queue = [];
  if (alive.length === 2) {
    // 先攻值多段：比值越高快者连动越多（2×→2次, 4×→3次, 6×→4次, 8×→5次, 10×→6次）
    // 极品装备 extraActions 额外追加本回合连动次数；增益·速度 buff 提升实际先攻
    const pInit = p.init * buffMul(p, 'init');
    const eInit = e.init * buffMul(e, 'init');
    const faster = pInit >= eInit ? p : e;
    const slower = faster === p ? e : p;
    const ratio = faster.init / Math.max(1, slower.init);
    let n = ratio >= 2 ? Math.floor(ratio / 2) + 1 : 1;
    n += (faster.extraActions || 0);
    for (let i = 0; i < n; i++) queue.push(faster);
    queue.push(slower);
  } else if (alive.length === 1) {
    queue = alive; // 一方被僵直，仅另一方行动
  } else {
    queue = []; // 双方均被僵直：跳过本回合
  }
  battle.queue = queue;
  battle.turn = 0;
  processTurn();
}

function processTurn() {
  if (checkEnd()) return;
  while (battle.turn < battle.queue.length && battle.queue[battle.turn].hp <= 0) battle.turn++;
  if (battle.turn >= battle.queue.length) { beginRound(); return; }

  const cur = battle.queue[battle.turn];
  cur.defending = false; // 防御只持续到自身下一回合

  if (cur.isEnemy) {
    awaitingInput = false;
    setButtons(false);
    battle.msg = cur.name + ' 的回合';
    setTimeout(() => enemyAct(cur), 650);
  } else {
    awaitingInput = true;
    battle.msg = '你的回合 — 选择指令';
    setButtons(true);
  }
}

function setButtons(on) {
  [...cmdBar.querySelectorAll('button')].forEach(b => {
    const act = b.dataset.act;
    let enabled = on;
    if (act === 'skill') {
      const c = +b.dataset.cost;
      if (player.mp < c) enabled = false; // 灵力不足置灰
    }
    if (act === 'item' && player.potions <= 0) enabled = false;
    b.disabled = !enabled;
    b.style.opacity = enabled ? '1' : '0.4';
  });
}

function damage(attacker, target, mult, type) {
  // 闪避判定：目标闪避率越高越易躲开
  if (target.eva && Math.random() < target.eva) {
    floats.push({ x: target._x, y: target._y, text: '闪避', color: '#9B6BCC', ttl: 60 });
    battle.msg = target.name + ' 身形一晃，闪开了攻击！';
    return 0;
  }
  // 物理攻击用 atk/def，精神攻击用 spiAtk/spiDef；增益/减益乘区实时生效
  const isSpirit = type === 'spirit';
  const atkStat = (isSpirit ? attacker.spiAtk : attacker.atk) * buffMul(attacker, isSpirit ? 'spiAtk' : 'atk');
  const defStat = (isSpirit ? target.spiDef : target.def) * debuffMul(target, isSpirit ? 'spiDef' : 'def');
  let base = atkStat * mult - defStat * 0.5;
  // 暴击：基础 15% + 增益·暴击 buff
  const critChance = 0.15 + Math.max(0, buffMul(attacker, 'crit') - 1);
  const crit = Math.random() < critChance;
  if (crit) base *= 1.5;
  if (target.defending) base *= 0.5;
  // 护体（shield）：按比例减伤
  if (target.shield && target.shield.pct) base *= (1 - target.shield.pct);
  base = Math.max(1, Math.round(base));
  target.hp = Math.max(0, target.hp - base);
  const col = crit ? '#A32D2D' : '#2C2C2A';
  const txt = (crit ? '暴击 ' : '') + '-' + base;
  floats.push({ x: target._x, y: target._y, text: txt, color: col, ttl: 60 });
  return base;
}

// 施展功法（player 的 SKILLS_DB 条目，含 effect）
function applySkill(actor, target, sk) {
  actor.mp -= sk.cost;
  const e = sk.effect || { kind: 'dmg', type: sk.type, mult: sk.mult };
  const floatAt = (u, text, color) => floats.push({ x: u._x, y: u._y, text, color, ttl: 60 });
  switch (e.kind) {
    case 'dmg': {
      let d;
      if (e.pierce) { // 穿透：无视部分护甲
        const atkStat = (e.type === 'spirit' ? actor.spiAtk : actor.atk) * buffMul(actor, e.type === 'spirit' ? 'spiAtk' : 'atk');
        const defStat = (e.type === 'spirit' ? target.spiDef : target.def) * 0.25;
        let base = atkStat * e.mult - defStat;
        if (Math.random() < 0.15) base *= 1.5;
        if (target.defending) base *= 0.5;
        d = Math.max(1, Math.round(base));
        target.hp = Math.max(0, target.hp - d);
      } else {
        d = damage(actor, target, e.mult, e.type);
      }
      battle.msg = actor.name + ' 施展「' + sk.name + '」造成 ' + d + ' 伤害';
      if (e.lifesteal) { const h = Math.round(d * e.lifesteal); actor.hp = Math.min(actor.maxHp, actor.hp + h); floatAt(actor, '+' + h, '#3B6D11'); }
      break;
    }
    case 'heal_hp': {
      const amt = Math.round(actor.maxHp * (e.pct || 0)) + (e.flat || 0);
      actor.hp = Math.min(actor.maxHp, actor.hp + amt);
      floatAt(actor, '+' + amt, '#3B6D11');
      battle.msg = actor.name + ' 施展「' + sk.name + '」回复 ' + amt + ' 气血';
      break;
    }
    case 'heal_mp': {
      const amt = Math.round(actor.maxMp * (e.pct || 0)) + (e.flat || 0);
      actor.mp = Math.min(actor.maxMp, actor.mp + amt);
      floatAt(actor, '+' + amt + '灵', '#378ADD');
      battle.msg = actor.name + ' 施展「' + sk.name + '」回复 ' + amt + ' 灵力';
      break;
    }
    case 'shield': {
      actor.shield = { pct: e.pct, dur: e.dur };
      battle.msg = actor.name + ' 施展「' + sk.name + '」护体（减伤 ' + Math.round(e.pct * 100) + '%）';
      break;
    }
    case 'buff': {
      actor.buffs.push({ stat: e.stat, amt: e.amt, dur: e.dur });
      battle.msg = actor.name + ' 施展「' + sk.name + '」' + statCn(e.stat) + '提升';
      break;
    }
    case 'debuff': {
      target.debuffs.push({ stat: e.stat, amt: e.amt, dur: e.dur });
      battle.msg = actor.name + ' 施展「' + sk.name + '」削弱 ' + target.name;
      break;
    }
    case 'stun': {
      target.stun = (target.stun || 0) + e.dur;
      battle.msg = actor.name + ' 施展「' + sk.name + '」令 ' + target.name + ' 僵直';
      break;
    }
    case 'absorb': { // 化盾：按伤害比例转为护盾吸收
      actor.shield = { pct: 1, dur: e.dur, absorb: e.amt };
      battle.msg = actor.name + ' 施展「' + sk.name + '」凝盾';
      break;
    }
    case 'critup': {
      actor.buffs.push({ stat: 'crit', amt: e.amt, dur: e.dur });
      battle.msg = actor.name + ' 施展「' + sk.name + '」暴击提升';
      break;
    }
    default:
      battle.msg = actor.name + ' 施展「' + sk.name + '」（未知效果）';
  }
}

function statCn(stat) {
  return ({ atk: '攻击', def: '防御', init: '速度', spiAtk: '精神攻击', spiDef: '精神防御', crit: '暴击' })[stat] || stat;
}

function applyAction(actor, target, act) {
  if (act === 'attack') {
    const d = damage(actor, target, 1.0);
    battle.msg = actor.name + ' 使出攻击，造成 ' + d + ' 伤害';
  } else if (act === 'skill') {
    // 敌方专用（玩家功法走 applySkill）
    const sk = actor.skill;
    actor.mp -= sk.cost;
    const d = damage(actor, target, sk.mult, sk.type);
    battle.msg = actor.name + ' 施展「' + sk.name + '」，造成 ' + d + ' 伤害';
  } else if (act === 'defend') {
    actor.defending = true;
    battle.msg = actor.name + ' 运功防御，下一击伤害减半';
  } else if (act === 'item') {
    if (actor.potions > 0) {
      actor.potions--;
      const heal = 50;
      actor.hp = Math.min(actor.maxHp, actor.hp + heal);
      floats.push({ x: actor._x, y: actor._y, text: '+' + heal, color: '#3B6D11', ttl: 60 });
      battle.msg = actor.name + ' 服用金疮药，恢复 ' + heal + ' 气血';
    }
  }
}

function enemyAct(enemy) {
  const act = (enemy.mp >= enemy.skill.cost && Math.random() < 0.5) ? 'skill' : 'attack';
  applyAction(enemy, battle.player, act);
  nextTurn();
}

function playerAct(act, skillId) {
  if (!awaitingInput) return;
  awaitingInput = false;
  setButtons(false);
  if (act === 'skill') {
    const sk = skillId ? SKILLS_DB_MAP[skillId] : null;
    if (sk && player.mp >= sk.cost) {
      applySkill(battle.player, battle.enemy, sk);
    } else {
      applyAction(battle.player, battle.enemy, 'attack'); // 灵力不足回退普攻
    }
  } else {
    applyAction(battle.player, battle.enemy, act);
  }
  nextTurn();
}

function nextTurn() {
  battle.turn++;
  setTimeout(processTurn, 500);
}

function checkEnd() {
  if (battle.enemy.hp <= 0) {
    endBattle(true); return true;
  }
  if (battle.player.hp <= 0) {
    endBattle(false); return true;
  }
  return false;
}

function endBattle(win) {
  awaitingInput = false;
  setButtons(false);
  if (win) {
    battle.node.cleared = true;
    const before = CULTIVATION.realmFromXp(player.xp).globalIndex;
    let dropMsg = '';
    let clearAll = false; // 江湖地图全通
    if (battle.mode === 'story') {
      const st = battle.node._story || {};
      const ch = st.ch, lv = st.lv;
      // 经验奖励：本章该关的经验（喂入 CULTIVATION 经验曲线）
      gainXp(STORY_BY_CH[ch].levels[lv - 1], false);
      player.score = player.xp;
      player.gold = (player.gold || 0) + (10 + ch);
      // 进度推进：记录本章已通关的最高关卡
      const prev = player.storyCleared[ch] || 0;
      if (lv > prev) player.storyCleared[ch] = lv;
      // 小概率装备掉落（与江湖手感一致）
      if (Math.random() < 0.35) {
        const dslot = EQUIP_SLOT_KEYS[Math.floor(Math.random() * EQUIP_SLOT_KEYS.length)];
        const drop = genEquip(dslot, rollRarity());
        player.bag.push(drop);
        dropMsg = ' 拾得' + drop.name + '！';
      }
    } else {
      const gain = 100 * battle.node.id;            // 战绩分：按节点难度递增
      player.xp += gain;
      player.score = player.xp;                     // 战绩分=累计修为，排行榜可直接显示境界
      const goldGain = 20 + battle.node.id * 15;
      player.gold = (player.gold || 0) + goldGain;
      if (Math.random() < 0.4) {
        const dslot = EQUIP_SLOT_KEYS[Math.floor(Math.random() * EQUIP_SLOT_KEYS.length)];
        const drop = genEquip(dslot, rollRarity());
        player.bag.push(drop);
        dropMsg = ' 拾得' + drop.name + '！';
      }
      // 功法掉落：BOSS 高概率、普通战低概率；只掉未习得且非「待副本」锁定的功法
      const skillChance = battle.node.type === 'boss' ? 0.6 : 0.2;
      if (Math.random() < skillChance) {
        const pool = SKILLS_DB.filter(s => !player.learned.includes(s.id) && !s.lockedUntil);
        if (pool.length) {
          const ds = pool[Math.floor(Math.random() * pool.length)];
          player.learned.push(ds.id);
          dropMsg += ' 习得功法《' + ds.name + '》！';
        }
      }
      if (battle.node.id === nodes.length - 1) clearAll = true;
    }
    if (window.Online && window.Online.onProgress) window.Online.onProgress(player.score);
    const after = CULTIVATION.realmFromXp(player.xp);
    const oldMax = player.maxHp;
    recalcStats(player);                          // 境界提升 → 属性增强
    player.hp = Math.min(player.maxHp, (player.hp || 0) + (player.maxHp - oldMax) + 40); // 突破增益 + 胜利回血
    player.mp = player.maxMp;
    state = (battle.mode === 'story') ? 'win' : (clearAll ? 'clear' : 'win');
    const broke = after.globalIndex > before;
    const realmUp = after.realmIndex > CULTIVATION.FLAT[before].realmIndex;
    let toastMsg = clearAll ? '你击败了' + battle.node.enemy.name + '，江湖太平！' : '胜利！';
    if (broke) toastMsg = (realmUp ? '★ 突破大境界！晋升【' : '突破！晋升【') + after.label + '】';
    toast = toastMsg + dropMsg + (battle.mode === 'story' ? ' 点击继续。' : ' 点击地图继续。');
    saveGame();
  } else {
    state = 'lose';
    toast = battle.mode === 'story' ? '你倒下了…点击重新挑战。' : '你倒下了…点击地图重新挑战。';
  }
}

// ---- 输入（事件委托：指令栏按钮每场战斗动态重建）----
cmdBar.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  playerAct(b.dataset.act, b.dataset.skill);
});

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  if (state === 'map') {
    for (const n of nodes) {
      if (Math.hypot(x - n.x, y - n.y) < 26 && unlocked(n.id)) {
        if (n.type === 'start') { toast = '清风镇 — 休整之地，点击前方地点出发。'; }
        else startBattle(n);
        return;
      }
    }
    // 点击空白区域 → 返回主页
    if (window.HUB) { window.HUB.show(); }
  } else if (state === 'win' || state === 'lose' || state === 'clear') {
    // 战斗结束 → 剧情副本返回副本界面，江湖战斗返回主页
    if (battle && battle.mode === 'story') {
      const ch = battle.node._story ? battle.node._story.ch : 1;
      if (player.storyCleared[ch] >= 10) openStoryScreen();   // 章节通关 → 触发三选一奖励
      else if (window.openChapter) openChapter(ch);          // 否则继续下一关
      else openStoryScreen();
    } else if (window.HUB) { window.HUB.refresh(); window.HUB.show(); }
    else { state = 'map'; toast = ''; }
  }
});

// ---- 渲染 ----
function drawPlaceholder(x, y, w, h, label, tint) {
  ctx.fillStyle = '#D3D1C7';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#888780';
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
  ctx.fillStyle = '#5F5E5A';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2);
}

function bar(x, y, w, ratio, color) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, w, 8);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, ratio), 8);
  ctx.strokeStyle = '#B4B2A9';
  ctx.strokeRect(x, y, w, 8);
}

function drawMap() {
  // 路径
  ctx.strokeStyle = '#B4B2A9';
  ctx.lineWidth = 2;
  for (let i = 1; i < nodes.length; i++) {
    ctx.beginPath();
    ctx.moveTo(nodes[i - 1].x, nodes[i - 1].y);
    ctx.lineTo(nodes[i].x, nodes[i].y);
    ctx.stroke();
  }
  // 节点
  for (const n of nodes) {
    const on = unlocked(n.id);
    ctx.beginPath();
    ctx.arc(n.x, n.y, 18, 0, Math.PI * 2);
    ctx.fillStyle = n.cleared ? '#97C459' : (on ? '#85B7EB' : '#D3D1C7');
    ctx.fill();
    ctx.strokeStyle = n.type === 'boss' ? '#C0392B' : '#5F5E5A';
    ctx.lineWidth = n.type === 'boss' ? 3 : 1;
    ctx.stroke();
    ctx.fillStyle = '#2C2C2A';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(n.name, n.x, n.y + 34);
    if (n.cleared) { ctx.fillStyle = '#3B6D11'; ctx.fillText('✓', n.x, n.y + 4); }
  }
  ctx.fillStyle = '#2C2C2A';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('江湖地图 · ' + CULTIVATION.realmFromXp(player.xp).label + ' — 点击蓝色地点启程（空白处返回主页）', 20, 30);
}

function drawBattle() {
  // 背景
  if (ready(art.bg)) {
    ctx.drawImage(art.bg, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#E9E4D8';
    ctx.fillRect(0, 0, W, H);
  }
  const p = battle.player, e = battle.enemy;
  p._x = 150; p._y = 200;
  e._x = 490; e._y = 160;

  // 敌方
  if (ready(art.enemy)) ctx.drawImage(art.enemy, e._x - 50, e._y - 70, 100, 140);
  else drawPlaceholder(e._x - 50, e._y - 70, 100, 140, '即梦·敌方立绘', '#D3D1C7');
  // 我方
  if (ready(art.hero)) ctx.drawImage(art.hero, p._x - 50, p._y - 70, 100, 140);
  else drawPlaceholder(p._x - 50, p._y - 70, 100, 140, '即梦·我方立绘', '#D3D1C7');

  // 血条/内力条
  ctx.textAlign = 'left';
  ctx.fillStyle = '#2C2C2A'; ctx.font = '12px sans-serif';
  ctx.fillText(p.name + '　' + CULTIVATION.realmFromXp(p.xp).label, p._x - 50, p._y - 80);
  bar(p._x - 50, p._y - 74, 100, p.hp / p.maxHp, '#639922');
  bar(p._x - 50, p._y - 64, 100, p.mp / p.maxMp, '#378ADD');

  ctx.textAlign = 'right';
  ctx.fillStyle = '#2C2C2A';
  ctx.fillText(e.name, e._x + 50, e._y - 80);
  bar(e._x - 50, e._y - 74, 100, e.hp / e.maxHp, '#A32D2D');
  bar(e._x - 50, e._y - 64, 100, e.mp / e.maxMp, '#378ADD');

  // 飘字
  floats.forEach(f => {
    ctx.globalAlpha = Math.max(0, f.ttl / 60);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y - (60 - f.ttl) * 0.5);
    ctx.globalAlpha = 1;
  });
  floats = floats.filter(f => --f.ttl > 0);

  // 底部信息
  ctx.fillStyle = 'rgba(241,239,232,0.92)';
  ctx.fillRect(0, H - 30, W, 30);
  ctx.fillStyle = '#2C2C2A';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(battle.msg + '　(丹药:' + p.potions + ')', 12, H - 10);
}

function drawOverlay(text) {
  ctx.fillStyle = 'rgba(44,44,42,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, W / 2, H / 2);
}

function render() {
  // 主页/创建界面是 DOM 层，不需要画布持续重绘；跳过 60fps 空转，把算力让给视频解码
  if (state === 'hub' || state === 'create') { requestAnimationFrame(render); return; }
  ctx.clearRect(0, 0, W, H);
  if (state === 'create') {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  } else if (state === 'map') {
    drawMap();
  } else if (state === 'battle') {
    drawBattle();
  } else if (state === 'win') {
    drawBattle(); drawOverlay('胜 利');
  } else if (state === 'lose') {
    drawBattle(); drawOverlay('败 北');
  } else if (state === 'clear') {
    drawBattle(); drawOverlay('江 湖 太 平');
  }
  if (toast) {
    ctx.fillStyle = 'rgba(241,239,232,0.95)';
    ctx.fillRect(0, H - 24, W, 24);
    ctx.fillStyle = '#2C2C2A';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(toast, W / 2, H - 8);
  }
  requestAnimationFrame(render);
}

</script>
<script>

  { id: 'daily',  label: '每日奖励', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>', action: 'modal_coming' },
  { id: 'rank',   label: '排行榜', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="5"/><path d="M8 21h8M12 13v8"/><path d="M7 4l2 2M17 4l-2 2"/></svg>', action: 'go_rank' },
  { id: 'arena',  label: '竞技场', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M17 15l4 4M3 3l18 18"/></svg>', action: 'modal_coming' },
];

function calcCombatPower(p) {
  return Math.floor(
    (p.maxHp * 1.2) + (p.atk * 15) + (p.def * 12) + (p.spd * 8) +
    (p.maxMp * 2) + (p.spiAtk * 10) + (p.init * 2)
  );
}

function formatNum(n) { return n.toLocaleString('zh-CN'); }

// 装备对比：关键派生属性之和（eva 按 *100 折算），用于标"更优"
function equipScore(item) {
  if (!item) return 0;
  const b = item.bonus || {};
  return (b.atk || 0) + (b.def || 0) + (b.maxHp || 0) + (b.maxMp || 0) +
         (b.spiAtk || 0) + (b.spiDef || 0) + (b.init || 0) + (b.eva || 0) * 100;
}
// a 是否优于 b（b 为空部位则视为更好）
function compareEquip(a, b) {
  if (!a) return false;
  if (!b) return true;
  return equipScore(a) > equipScore(b);
}
const SELL_PRICE = { fan: 8, ling: 15, bao: 28, xian: 50, shen: 90 };   // 出售价（按品质）
const SHOP_PRICE = { fan: 30, ling: 60, bao: 120, xian: 240, shen: 480 }; // 商店价（按品质）

function initHub() {
  const hub = document.getElementById('hub-screen');
  const menuContainer = document.getElementById('hub-menu');
  const avatarEl = document.getElementById('hub-avatar');
  const nameEl = document.getElementById('hub-name');
  const powerEl = document.getElementById('hub-power-num');
  const charVideo = document.getElementById('hub-char-video');
  const charStatic = document.getElementById('hub-char-static');

  // 视频加载失败 → 回退静态立绘（只绑一次）
  if (!charVideo._errBound) {
    charVideo.addEventListener('error', () => {
      charVideo.setAttribute('hidden', '');
      charStatic.removeAttribute('hidden');
      charStatic.src = art.hero.src || '';
    });
    charVideo._errBound = true;
  }

  // 渲染菜单按钮
  menuContainer.innerHTML = HUB_MENU_ITEMS.map(item =>
    `<button class="hub-btn" data-hub="${item.id}" title="${item.label}">${item.icon}<span>${item.label}</span></button>`
  ).join('');

  // 绑定按钮事件
  menuContainer.querySelectorAll('.hub-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = HUB_MENU_ITEMS.find(i => i.id === btn.dataset.hub);
      if (!item) return;
      switch (item.action) {
        case 'go_map':
          hub.setAttribute('hidden', '');
          state = 'map';
          setButtons(false);
          render();
          break;
        case 'go_story':
          openStoryScreen();
          break;
        case 'go_rank':
          if (window.Online && window.Online.showBoard) window.Online.showBoard();
          else openModal('<h3 style="color:#D4A843">排行榜</h3><p style="color:rgba(241,239,232,0.7)">联网功能尚未开启，完成腾讯云配置后即可查看全服排行榜。</p><button class="btn-full" onclick="closeModal()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">关闭</button>');
          break;

        case 'modal_skills':

          break;
        case 'modal_equip':
          showEquipModal();

          showBagModal();
          break;
        case 'modal_shop':
          showShopModal();
          break;
        default:
          openModal(`<h3 style="color:#D4A843">${item.label}</h3><p style="color:rgba(241,239,232,0.7)">「${item.label}」功能正在开发中，敬请期待！</p><button class="btn-full" onclick="closeModal()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">关闭</button>`);
      }
    });
  });

  // ====== 全局：主页境界/进度条同步（弹窗和主页共用同一份数据） ======
  function syncRealmDOM() {
    // CULTIVATION 是 cultivation.js 里 const 声明的脚本级变量（非 window 属性），直接引用即可
    if (typeof CULTIVATION === 'undefined') { console.warn('[syncRealm] CULTIVATION not loaded yet'); return; }
    const r = CULTIVATION.realmFromXp(player.xp);
    const el = (id) => document.getElementById(id);
    const re = el('hub-realm'), xf = el('hub-xp-fill'), xr = el('hub-xp-realm'), xn = el('hub-xp-nums');
    console.log('[syncRealm]', r.label, 'progress:', Math.round((r.progress||0)*100) + '%', 'xp:', r.xpIntoStage + '/' + r.xpForStage);
    if (re) re.textContent = r.label || '凡人';
    if (xf) xf.style.width = Math.round((r.progress || 0) * 100) + '%';
    if (xr) xr.textContent = (r.label || '凡人').split(' ')[0]; // 只取"筑基境"不含重天
    if (xn) xn.textContent = formatNum(r.xpIntoStage) + '/' + formatNum(r.xpForStage);
  }

  // 更新主页数据
  function refreshHub() {
    nameEl.textContent = player.name || '逍遥仙';
    powerEl.textContent = formatNum(calcCombatPower(player));
    avatarEl.src = 'assets/select/avatar_head.png?v=1';
    syncRealmDOM();
    // 角色展示：优先用该角色的视频，没有则用静态立绘
    const _all = CHARACTERS.male.concat(CHARACTERS.female);
    const _cur = _all.find(c => c.id === player.avatarId);
    const videoSrc = _cur && _cur.video ? _cur.video : '';
    if (videoSrc) {
      charStatic.setAttribute('hidden', '');
      charVideo.removeAttribute('hidden');
      if (charVideo.getAttribute('src') !== videoSrc) {
        charVideo.setAttribute('src', videoSrc);
        charVideo.load();
      }
      charVideo.play().catch(() => {});
    } else {
      charVideo.setAttribute('hidden', '');
      charStatic.removeAttribute('hidden');
      charStatic.src = art.hero.src || '';
    }
  }

  // 挂机：在线停留即自动累加修为（主页/地图/战斗画面）
  if (!window._hubIdleStarted) {
    window._hubIdleStarted = true;
    let _saveTick = 0;
    setInterval(() => {
      if (state === 'hub' || state === 'map' || state === 'battle') {
        gainXp(ONLINE_XP_PER_SEC * (1 + player.xpBonus), false);
        powerEl.textContent = formatNum(calcCombatPower(player));
        syncRealmDOM(); // 每秒同步境界+进度条
      }
      player.lastSeen = Date.now();
      if (++_saveTick % 5 === 0) saveGame(); // 每 5 秒落盘一次
    }, HUB_TICK_MS);
  }
