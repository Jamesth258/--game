  // 功法弹窗：最多装备 6 种，战斗中每回合点选；下方为已习得功法库（点选装备/卸下）
  function tierColor(t) { return ({ 1: '#9aa0a6', 2: '#639922', 3: '#378ADD', 4: '#9B6BCC', 5: '#D4A843', 6: '#E87B7B', 7: '#E8D9A0' })[t] || '#9aa0a6'; }

  function showSkillsModal() {
    refreshHub(); // 同步主页数据
    const equipped = player.equippedSkills || [];
    const learned = player.learned || [];
    const isEquipped = id => equipped.includes(id);
    // 已装备槽位（固定 6 格）
    const slotHtml = Array.from({ length: MAX_EQUIPPED }).map((_, i) => {
      const id = equipped[i];
      if (id && SKILLS_DB_MAP[id]) {
        const s = SKILLS_DB_MAP[id];
        return `<div class="bag-item"><div class="bag-info">
          <span class="equip-icon" style="color:${tierColor(s.tier)}">${s.tierName[0]}</span>
          <span class="bag-name">${esc(s.name)}</span>
          <span class="equip-bonus">${esc(s.schoolCn)} · ${s.cost}灵</span></div>
          <button class="equip-btn danger" onclick="unequipSkill('${id}')">卸下</button></div>`;
      }
      return `<div class="equip-slot" style="opacity:.45;text-align:center;color:rgba(241,239,232,.4);display:flex;align-items:center;justify-content:center">空槽位 ${i + 1}</div>`;
    }).join('');
    // 已习得功法库（点击装备）
    const libHtml = learned.map(id => {
      const s = SKILLS_DB_MAP[id]; if (!s) return '';
      const on = isEquipped(id);
      const full = !on && equipped.length >= MAX_EQUIPPED;
      return `<div class="bag-item"><div class="bag-info">
        <span class="equip-icon" style="color:${tierColor(s.tier)}">${s.tierName[0]}</span>
        <span class="bag-name">${esc(s.name)}</span>
        <span class="equip-bonus">${esc(s.schoolCn)} · ${s.cost}灵 · ${esc(s.desc)}</span></div>
        ${on ? '<span style="color:#639922;font-size:12px;white-space:nowrap">已装备</span>' : `<button class="equip-btn" ${full ? 'disabled' : ''} onclick="equipSkill('${id}')">装备</button>`}</div>`;
    }).join('');
    openModal(`
      <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <h3 style="margin:0">功法</h3></div>
      <p style="margin:4px 0;font-size:12px;color:rgba(241,239,232,0.6)">最多同时装备 <b style="color:#D4A843">${MAX_EQUIPPED}</b> 种功法；战斗中每回合自行点选施展。普攻恒为物理（0 灵力）。</p>
      <div class="equip-sec-title">已装备（${equipped.length}/${MAX_EQUIPPED}）</div>
      <div class="bag-list">${slotHtml}</div>
      <hr>
      <div class="equip-sec-title">已习得功法库（点击装备）</div>
      <div class="bag-list">${libHtml}</div>
      <button class="btn-full" onclick="showSkillShop()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">功法秘库（灵石兑换）</button>
      <button class="btn-full" onclick="closeModal()" style="margin-top:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">关闭</button>`);
  }

  // 装备/卸下功法（≤6）
  function equipSkill(id) {
    if (!player.learned.includes(id)) return;
    if ((player.equippedSkills || []).includes(id)) return;
    if ((player.equippedSkills || []).length >= MAX_EQUIPPED) return;
    player.equippedSkills = player.equippedSkills || [];
    player.equippedSkills.push(id);
    saveGame(); refreshHub(); showSkillsModal();
  }
  function unequipSkill(id) {
    if (!player.equippedSkills) return;
    player.equippedSkills = player.equippedSkills.filter(x => x !== id);
    saveGame(); refreshHub(); showSkillsModal();
  }
  window.equipSkill = equipSkill;
  window.unequipSkill = unequipSkill;

  // 功法秘库：灵石兑换未习得且非「待副本」锁定的功法
  const SKILL_SHOP_PRICE = { 1: 40, 2: 80, 3: 160, 4: 320, 5: 640, 6: 1280, 7: 2560 };
  function showSkillShop() {
    refreshHub();
    const gold = player.gold || 0;
    const pool = SKILLS_DB.filter(s => !player.learned.includes(s.id) && !s.lockedUntil);
    const copy = pool.slice();
    const picks = [];
    for (let i = 0; i < 6 && copy.length; i++) picks.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    const rows = picks.map(s => {
      const price = SKILL_SHOP_PRICE[s.tier] || 40;
      const can = gold >= price;
      return `<div class="bag-item"><div class="bag-info">
        <span class="equip-icon" style="color:${tierColor(s.tier)}">${s.tierName[0]}</span>
        <span class="bag-name">${esc(s.name)}</span>
        <span class="equip-bonus">${esc(s.schoolCn)} · ${s.cost}灵 · ${esc(s.desc)}</span></div>
        ${can ? `<button class="equip-btn" onclick="buySkill('${s.id}')">兑换·${price}灵</button>` : `<button class="equip-btn" disabled style="background:rgba(255,255,255,0.06);color:rgba(241,239,232,0.3);cursor:default">${price}灵</button>`}</div>`;
    }).join('');
    openModal(`
      <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <h3 style="margin:0">功法秘库</h3></div>
      <p style="margin:2px 0 10px;font-size:12px;color:rgba(241,239,232,0.6)">灵石 <b style="color:#D4A843">${gold}</b> · 兑换后自动进入功法库</p>
      <div class="bag-list">${rows}</div>
      <button class="btn-full" onclick="showSkillsModal()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">返回功法</button>`);
  }
  function buySkill(id) {
    const s = SKILLS_DB_MAP[id]; if (!s) return;
    const price = SKILL_SHOP_PRICE[s.tier] || 40;
    if ((player.gold || 0) < price) { showSkillShop(); return; }
    player.gold -= price;
    if (!player.learned.includes(id)) player.learned.push(id);
    saveGame(); refreshHub(); showSkillShop();
  }
  window.showSkillShop = showSkillShop;
  window.buySkill = buySkill;
  // 装备弹窗（穿戴 / 卸下 / 背包 / 锻造）
  function showEquipModal() {
    refreshHub(); // 同步主页战力
    const r = CULTIVATION.realmFromXp(player.xp);
    const gold = player.gold || 0;
    const forgeCost = 30 + r.globalIndex * 5;

    // 已穿戴的部位卡
    const slotCard = slot => {
      const def = EQUIP_SLOTS[slot];
      const it = player.equipment[slot];
      const body = it
        ? `<div class="equip-name" style="color:${it.rarityColor}">${esc(it.name)}</div>
           <div class="equip-bonus">${esc(equipBonusText(it))}</div>
           <button class="equip-btn danger" onclick="unequipSlot('${slot}')">卸下</button>`
        : `<div class="equip-name" style="color:rgba(241,239,232,0.4)">未装备</div>`;
      return `<div class="equip-slot">
        <div class="equip-slot-head"><span class="equip-icon">${def.icon}</span>${def.name}</div>
        ${body}
      </div>`;
    };

    // 背包列表
    const bagHtml = player.bag.length
      ? player.bag.map(it => `<div class="bag-item">
          <div class="bag-info"><span class="equip-icon">${EQUIP_SLOTS[it.slot].icon}</span>
            <span class="bag-name" style="color:${it.rarityColor}">${esc(it.name)}</span>
            <span class="equip-bonus">${esc(equipBonusText(it))}</span></div>
          <button class="equip-btn" onclick="equipItem('${it.uid}')">装备</button>
        </div>`).join('')
      : `<p style="color:rgba(241,239,232,0.4);font-size:12px;margin:6px 0">背包为空 — 击败江湖敌人可掉落装备，或用灵石锻造。</p>`;

    // 锻造按钮（每个部位一个）
    const forgeHtml = EQUIP_SLOT_KEYS.map(s =>
      `<button class="forge-btn" onclick="forgeEquip('${s}')">${EQUIP_SLOTS[s].icon} 锻造${EQUIP_SLOTS[s].name}<br><span class="forge-cost">${forgeCost} 灵石</span></button>`
    ).join('');

    openModal(`
      <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M12 2L4 7l8 5 8-5-8-5zM4 12l8 5 8-5M4 17l8 5 8-5"/></svg>
      <h3 style="margin:0">装备</h3></div>
      <p style="margin:2px 0 10px;font-size:12px;color:rgba(241,239,232,0.6)">灵石 <b style="color:#D4A843">${gold}</b> · 战力 <b style="color:#E87B7B">${formatNum(calcCombatPower(player))}</b></p>
      <div class="equip-slots">${EQUIP_SLOT_KEYS.map(slotCard).join('')}</div>
      <hr>
      <div class="equip-sec-title">背包（${player.bag.length}）</div>
      <div class="bag-list">${bagHtml}</div>
      <hr>
      <div class="equip-sec-title">锻造（消耗灵石，随机品质随境界提升）</div>
      <div class="forge-grid">${forgeHtml}</div>
      <button class="btn-full" onclick="closeModal()" style="margin-top:16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">关闭</button>`);
  }

  // 穿戴：从背包取出装备到对应部位，旧装备退回背包
  function equipItem(uid) {
    const i = player.bag.findIndex(it => it.uid === uid);
    if (i < 0) return;
    const item = player.bag[i];
    player.bag.splice(i, 1);
    const prev = player.equipment[item.slot];
    player.equipment[item.slot] = item;
    if (prev) player.bag.push(prev);
    recalcStats(player);
    player.hp = Math.min(player.hp, player.maxHp);
    saveGame();
    refreshHub();
    showEquipModal();
  }
  // 卸下：部位装备退回背包
  function unequipSlot(slot) {
    const it = player.equipment[slot];
    if (!it) return;
    player.equipment[slot] = null;
    player.bag.push(it);
    recalcStats(player);
    player.hp = Math.min(player.hp, player.maxHp);
    saveGame();
    refreshHub();
    showEquipModal();
  }
  // 锻造：消耗灵石生成随机品质装备进背包
  function forgeEquip(slot) {
    const tier = CULTIVATION.realmFromXp(player.xp).globalIndex;
    const cost = 30 + tier * 5;
    if ((player.gold || 0) < cost) {
      openModal(`<h3 style="color:#D4A843">灵石不足</h3><p style="color:rgba(241,239,232,0.75)">锻造${EQUIP_SLOTS[slot].name}需 ${cost} 灵石，当前仅有 ${player.gold || 0}。击败江湖敌人可获得灵石。</p><button class="btn-full" onclick="if(window.showEquipModal)window.showEquipModal()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">返回</button>`);
      return;
    }
    player.gold -= cost;
    player.bag.push(genEquip(slot, rollRarity()));
    saveGame();
    showEquipModal();
  }
  window.equipItem = equipItem;
  window.unequipSlot = unequipSlot;
  window.forgeEquip = forgeEquip;
  window.showEquipModal = showEquipModal;

  // 背包弹窗：列出全部装备，可装备 / 出售，并对比已穿戴部位标"更优"
  function showBagModal() {
    refreshHub();
    const gold = player.gold || 0;
    const list = player.bag.length
      ? player.bag.map(it => {
          const equipped = player.equipment[it.slot];
          const better = compareEquip(it, equipped);
          const sell = SELL_PRICE[it.rarity] || 8;
          return `<div class="bag-item">
            <div class="bag-info">
              <span class="equip-icon">${EQUIP_SLOTS[it.slot].icon}</span>
              <span class="bag-name" style="color:${it.rarityColor}">${esc(it.name)}</span>
              <span class="equip-bonus">${esc(equipBonusText(it))}${better ? ' <b style="color:#639922">▲更优</b>' : ''}</span>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0">
              <button class="equip-btn" onclick="equipItem('${it.uid}')">装备</button>
              <button class="equip-btn danger" onclick="sellItem('${it.uid}')">出售·${sell}</button>
            </div>
          </div>`;
        }).join('')
      : `<p style="color:rgba(241,239,232,0.4);font-size:12px;margin:6px 0">背包为空 — 击败江湖敌人可掉落装备，或去商店/锻造获取。</p>`;
    openModal(`
      <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      <h3 style="margin:0">背包</h3></div>
      <p style="margin:2px 0 10px;font-size:12px;color:rgba(241,239,232,0.6)">灵石 <b style="color:#D4A843">${gold}</b> · 装备 <b style="color:#fff">${player.bag.length}</b></p>
      <div class="equip-sec-title">背包装备</div>
      <div class="bag-list">${list}</div>
      <button class="btn-full" onclick="showShopModal()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">前往商店</button>
      <button class="btn-full" onclick="closeModal()" style="margin-top:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">关闭</button>`);
  }

  // 商店弹窗：4 部位各一件随机在售装备，灵石足够可购买；不足则禁用
  let shopStock = [];
  function showShopModal() {
    refreshHub();
    const gold = player.gold || 0;
    shopStock = EQUIP_SLOT_KEYS.map(slot => genEquip(slot, rollRarity())); // 每次打开随机生成
    const rows = shopStock.map(it => {
      const price = SHOP_PRICE[it.rarity] || 30;
      const can = gold >= price;
      const btn = can
        ? `<button class="equip-btn" onclick="buyShopItem('${it.uid}')">购买·${price}灵石</button>`
        : `<button class="equip-btn" disabled style="background:rgba(255,255,255,0.06);color:rgba(241,239,232,0.3);cursor:default">${price}灵石</button>`;
      return `<div class="bag-item">
        <div class="bag-info">
          <span class="equip-icon">${EQUIP_SLOTS[it.slot].icon}</span>
          <span class="bag-name" style="color:${it.rarityColor}">${esc(it.name)}</span>
          <span class="equip-bonus">${esc(equipBonusText(it))}</span>
        </div>
        ${btn}
      </div>`;
    }).join('');
    openModal(`
      <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <h3 style="margin:0">商店</h3></div>
      <p style="margin:2px 0 10px;font-size:12px;color:rgba(241,239,232,0.6)">灵石 <b style="color:#D4A843">${gold}</b></p>
      <div class="equip-sec-title">在售装备（每次刷新随机品质）</div>
      <div class="bag-list">${rows}</div>
      <button class="btn-full" onclick="showBagModal()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">背包 / 出售</button>
      <button class="btn-full" onclick="closeModal()" style="margin-top:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">关闭</button>`);
  }

  // 出售：背包装备按品质换灵石
  function sellItem(uid) {
    const i = player.bag.findIndex(it => it.uid === uid);
    if (i < 0) return;
    const it = player.bag[i];
    const sell = SELL_PRICE[it.rarity] || 8;
    player.bag.splice(i, 1);
    player.gold = (player.gold || 0) + sell;
    saveGame();
    refreshHub();
    showBagModal();
  }

  // 购买：商店装备进背包（灵石足够）
  function buyShopItem(uid) {
    const it = shopStock.find(x => x.uid === uid);
    if (!it) return;
    const price = SHOP_PRICE[it.rarity] || 30;
    if ((player.gold || 0) < price) { showShopModal(); return; }
    player.gold -= price;
    player.bag.push(it);
    shopStock = shopStock.filter(x => x.uid !== uid);
    saveGame();
    refreshHub();
    showShopModal();
  }
  window.showBagModal = showBagModal;
  window.showShopModal = showShopModal;
  window.sellItem = sellItem;
  window.buyShopItem = buyShopItem;

  // 兼容旧存档：若玩家仍持有旧版功法 id（xuanfeng/xuanyin），迁移为默认入门功法
  function migrateLegacySkills() {
    const legacy = ['xuanfeng', 'xuanyin'];
    if (player.learned && player.learned.some(id => legacy.includes(id))) {
      player.learned = DEFAULT_LEARNED.slice();
      player.equippedSkills = DEFAULT_EQUIPPED.slice();
      saveGame();
    }
  }
  migrateLegacySkills();

  // 加点（弹窗内按钮回调，挂在 window 上供 onclick 调用）
  function allocAttr(k, d) {
    const free = BASE_FREE_POINTS + CULTIVATION.realmFromXp(player.xp).globalIndex * POINTS_PER_STAGE - player.spent;
    if (d > 0) {
      if (free <= 0) return;
      player[k] += 1; player.spent += 1;
    } else {
      if (player[k] <= 10) return; // 不能低于初始值
      player[k] -= 1; player.spent -= 1;
    }
    recalcStats(player);
    refreshHub();
    saveGame();
    showAttrModal(); // 重渲染
  }
  window.allocAttr = allocAttr;

  // 暴露刷新接口
  window.HUB = { refresh: refreshHub, show: () => { hub.removeAttribute('hidden'); refreshHub(); }, hide: () => hub.setAttribute('hidden', '') };
  refreshHub();
}

window.GAME = { player, nodes }; // 暴露给 online.js 做云端存档/排行榜

</script>
<script>
/* create.js — 角色创建流程：名字/性别/形象三步
 * 由 index.html 拆分而来。加载顺序见 index.html 底部 <script> 列表，勿随意调整。
 * 注意：顶层 const/let 跨文件可直接引用，但不会挂到 window（详见 PROJECT.md 坑点 8.1）。
 */
// ===== 角色创建系统 =====
const CHARACTERS = {
  male: [
    { id: 'm1', name: '铁骨武者',   img: 'assets/select/m1_warrior.png?v=2', desc: '强壮刚毅，体修入道' },
    { id: 'm2', name: '少年侠客',   img: 'assets/select/m2_young.png?v=2',  desc: '年轻俊朗，天赋异禀', video: 'assets/char/char_m2.mp4?v=2' },
    { id: 'm3', name: '道骨仙风',   img: 'assets/select/m3_daoist.png?v=2', desc: '中年大叔，道法深厚' },
  ],
  female: [
    { id: 'f1', name: '灵气萝莉',   img: 'assets/select/f1_loli.png?v=2',   desc: '可爱灵动，根骨奇佳' },
    { id: 'f2', name: '绝代佳人',   img: 'assets/select/f2_hot.png?v=2',    desc: '性感热辣，魅惑众生' },
    { id: 'f3', name: '温婉御姐',   img: 'assets/select/f3_mature.png?v=2', desc: '成熟丰满，气质出众' },
  ],
};

const createScreen = document.getElementById('create-screen');
const nameInput = document.getElementById('char-name');
const nameErr = document.getElementById('name-err');
const charGrid = document.getElementById('char-grid');
let createData = { name: '', gender: '', avatar: null };

// 名字校验：仅汉字或字母
function isValidName(s) { return /^[\u4e00-\u9fa5a-zA-Z]+$/.test(s); }

// 步骤切换
function goToStep(n) {
  document.querySelectorAll('.create-step').forEach((el, i) => el.classList.toggle('active', i === n));
  document.querySelectorAll('.step-dot').forEach((el, i) => {
    el.classList.toggle('active', i === n);
    el.classList.toggle('done', i < n);
  });
}

// Step 1: 名字
nameInput.addEventListener('input', () => {
  const v = nameInput.value.trim();
  if (v.length === 0) { nameErr.textContent = ''; document.getElementById('name-next').disabled = true; return; }
  if (!isValidName(v)) { nameErr.textContent = '⚠ 名字只能包含汉字或字母，不能有数字或符号'; document.getElementById('name-next').disabled = true; return; }
  if (v.length < 2) { nameErr.textContent = ''; document.getElementById('name-next').disabled = true; return; }
  nameErr.textContent = '';
  createData.name = v;
  document.getElementById('name-next').disabled = false;
});
document.getElementById('name-next').addEventListener('click', () => { if (createData.name) goToStep(1); });

// Step 2: 性别
document.querySelectorAll('.gender-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.gender-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    createData.gender = card.dataset.g;
    document.getElementById('gender-next').disabled = false;

    // 预加载对应形象图到 grid
    renderAvatarGrid(createData.gender);
  });
});
document.getElementById('gender-back').addEventListener('click', () => goToStep(0));
document.getElementById('gender-next').addEventListener('click', () => { if (createData.gender) goToStep(2); });

// Step 3: 形象渲染与选择
function renderAvatarGrid(gender) {
  const list = CHARACTERS[gender] || [];
  charGrid.innerHTML = list.map(c =>
    `<div class="char-card" data-id="${c.id}">
      <img src="${c.img}" alt="${c.name}" loading="lazy"${c.pos ? ` style="object-position:${c.pos}"` : ''}>
      <div class="char-name">${c.name}</div>
    </div>`
  ).join('');

  // 绑定选择事件
  charGrid.querySelectorAll('.char-card').forEach(card => {
    card.addEventListener('click', () => {
      charGrid.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      createData.avatar = list.find(c => c.id === card.dataset.id);
      document.getElementById('avatar-confirm').disabled = false;

      // 选中的形象也作为战斗立绘
      if (createData.avatar) {
        art.hero.src = createData.avatar.img;
        art.hero.failed = false;
      }
    });
  });
}
document.getElementById('avatar-back').addEventListener('click', () => goToStep(1));

// 确认创建 → 进入游戏
document.getElementById('avatar-confirm').addEventListener('click', () => {
  if (!createData.avatar) return;
  player.name = createData.name;
  player.sect = createData.avatar.desc; // 用形象描述作为初始门派/定位
  player.avatarId = createData.avatar.id;
  // 立绘已在选择时设置 (art.hero.src)
  applyStarterEquip(); // 赠送初始凡品套装（自动穿戴）
  player.learned = DEFAULT_LEARNED.slice();        // 初始功法库（涵盖攻/精/回灵/防御增益/回血/减益）
  player.equippedSkills = DEFAULT_EQUIPPED.slice(); // 初始装备 6 种（战斗中每回合点选）
  recalcStats(player);
  player.hp = player.maxHp; player.mp = player.maxMp;

  // 隐藏创建界面，显示主页
  createScreen.setAttribute('hidden', '');
  initHub();
  window.HUB.show(); // 进入主页（而非直接进地图）

  saveGame(); // 存入 localStorage（下次打开不再重复创建）
});

</script>
<script>
/* story.js — 剧情副本系统：卷/章/关目录 + 战斗入口 + 章节通关三选一奖励
 * 依赖（均脚本级全局，已在前序 <script> 加载）：player, STORY_CHAPTERS/STORY_VOLUMES/STORY_BY_CH,
 *   SKILLS_DB_MAP, RARITY, EQUIP_SLOTS, genEquip, startBattle, openModal/closeModal/esc, saveGame, HUB
 * 加载顺序见 index.html：story-data.js → battle.js → hub.js → create.js → story.js → main.js
 */
// ===== 剧情副本系统 =====
let _storyVol = 1;     // 当前查看的卷（1~10）
let _storyCh = 1;      // 最近挑战的章节（战斗结束返回用）
let _selSkill = null;  // 三选一当前选中的功法 id
let _selEquip = 0;     // 三选一当前选中的装备序号

function sTierColor(t) { return ({ 1: '#9aa0a6', 2: '#639922', 3: '#378ADD', 4: '#9B6BCC', 5: '#D4A843', 6: '#E87B7B', 7: '#E8D9A0' })[t] || '#9aa0a6'; }

// 章节解锁：第 1 章默开；其余需前一章 10 关全通
function storyChapterUnlocked(ch) { return ch === 1 || (player.storyCleared[ch - 1] || 0) >= 10; }

// 按章节/关卡缩放敌方强度（以玩家当前属性为基准 × 章节难度系数，保证可战胜且随进度变难）
function makeStoryEnemy(ch, lv) {
  const data = STORY_BY_CH[ch];
  const isBoss = lv === 10;
  const D = 0.5 + ch * 0.05 + lv * 0.012;   // ch1≈0.56 → ch100≈5.62
  const p = player;
  const hp = Math.round((p.maxHp * 0.55 + 90) * D * (isBoss ? 1.7 : 1));
  const atk = Math.round((p.atk * 0.42 + 12) * D);
  const def = Math.round((p.def * 0.45 + 6) * D);
  const spd = Math.round(p.spd * 0.82 + ch * 0.22 + (isBoss ? 6 : 0));
  const mp = 40 + Math.floor(ch / 2);
  return {
    name: data.title + (isBoss ? '·守关boss' : '·第' + lv + '关'),
    isEnemy: true,
    maxHp: hp, hp: hp, maxMp: mp, mp: mp,
    atk, def, spd,
    init: Math.round(10 + spd * 2), eva: Math.min(0.2, 0.05 + ch * 0.001),
    spiAtk: Math.round(p.spiAtk * 0.4 * D), spiDef: Math.round((p.spiDef * 0.4 + 4) * D), luck: 0,
    potions: 0, defending: false, extraActions: 0,
    buffs: [], debuffs: [], shield: null, stun: 0,
    skill: { name: '敌袭', type: 'phys', mult: 1.7 + ch * 0.01, cost: 10 },
  };
}

// 进入某关战斗（复用 battle.js 的 startBattle，模式标记为 story）
function startStoryBattle(ch, lv) {
  _storyCh = ch;
  const enemy = makeStoryEnemy(ch, lv);
  const node = { id: -1, type: lv === 10 ? 'boss' : 'battle', cleared: false, enemy, _story: { ch, lv } };
  if (window.HUB) window.HUB.hide();
  closeModal();
  state = 'battle';
  startBattle(node, 'story');
}

// ===== 副本主页：卷标签 + 章节卡片 =====
function openStoryScreen() {
  // 若有已通关但未领奖励的章节 → 先弹三选一
  for (let c = 1; c <= 100; c++) {
    if ((player.storyCleared[c] || 0) >= 10 && !player.storyRewardClaimed[c]) { showStoryReward(c); return; }
  }
  state = 'hub';
  if (window.HUB) window.HUB.hide();
  const volTabs = STORY_VOLUMES.map(v =>
    `<button class="story-vol-tab ${v.vol === _storyVol ? 'on' : ''}" onclick="storySetVol(${v.vol})">${esc(v.name.split('·')[1] || v.name)}</button>`
  ).join('');
  const vol = STORY_VOLUMES[_storyVol - 1];
  const chapters = [];
  for (let c = vol.range[0]; c <= vol.range[1]; c++) {
    const d = STORY_BY_CH[c];
    const unlocked = storyChapterUnlocked(c);
    const cleared = player.storyCleared[c] || 0;
    const prog = cleared >= 10 ? '★ 通关' : (cleared > 0 ? '已通 ' + cleared + '/10' : '未通关');
    chapters.push(`<div class="bag-item">
      <div class="bag-info">
        <span class="equip-icon" style="color:${sTierColor(d.tier)}">${d.tierName[0]}</span>
        <span class="bag-name">第${c}章 · ${esc(d.title)}</span>
        <span class="equip-bonus">${esc(d.realmName)} · 功法${d.tierName} · 装备${d.rarityName} · ${prog}</span>
      </div>
      ${unlocked
        ? `<button class="equip-btn" onclick="storyEnterChapter(${c})">进入</button>`
        : `<button class="equip-btn" disabled style="background:rgba(255,255,255,0.06);color:rgba(241,239,232,0.3);cursor:default">先通第${c - 1}章</button>`}
    </div>`);
  }
  openModal(`
    <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    <h3 style="margin:0">剧情副本</h3></div>
    <p style="margin:2px 0 8px;font-size:12px;color:rgba(241,239,232,0.6)">每章 10 关，单关胜得经验；通关领 <b style="color:#D4A843">功法三选一 + 装备三选一</b>。改编自热门仙侠小说。</p>
    <div class="story-vol-tabs">${volTabs}</div>
    <div class="equip-sec-title">${esc(vol.name)} · 改编自《${esc(vol.inspiredBy)}》</div>
    <div class="bag-list">${chapters.join('')}</div>
    <button class="btn-full" onclick="storyClose()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">返回主页</button>`);
}

function storySetVol(v) { _storyVol = v; openStoryScreen(); }
function storyEnterChapter(c) { if (storyChapterUnlocked(c)) openChapter(c); }
function storyClose() { closeModal(); state = 'hub'; if (window.HUB) { window.HUB.refresh(); window.HUB.show(); } }
function storyBackVol() { openStoryScreen(); }

// ===== 章节详情：10 关 + 通关奖励预览 =====
function openChapter(ch) {
  const d = STORY_BY_CH[ch];
  const cleared = player.storyCleared[ch] || 0;
  const rows = [];
  for (let lv = 1; lv <= 10; lv++) {
    const isClear = cleared >= lv;
    const isNext = lv === cleared + 1;
    const canFight = isClear || isNext;
    const isBoss = lv === 10;
    let status, btn;
    if (isClear) { status = '✓ 已通关'; btn = `<button class="equip-btn" onclick="startStoryBattle(${ch},${lv})">重战</button>`; }
    else if (isNext) { status = isBoss ? '⚔ 守关BOSS' : '▶ 可挑战'; btn = `<button class="equip-btn" onclick="startStoryBattle(${ch},${lv})">挑战</button>`; }
    else { status = '🔒 未解锁'; btn = `<button class="equip-btn" disabled style="background:rgba(255,255,255,0.06);color:rgba(241,239,232,0.3);cursor:default">锁定</button>`; }
    rows.push(`<div class="bag-item">
      <div class="bag-info">
        <span class="equip-icon" style="color:${isBoss ? '#C0392B' : '#9B6BCC'}">${lv}</span>
        <span class="bag-name">第${lv}关 ${isBoss ? '（BOSS）' : ''}</span>
        <span class="equip-bonus">经验 +${d.levels[lv - 1]}${isClear ? ' · ' + status : ''}</span>
      </div>
      ${btn}
    </div>`);
  }
  const rw = d.reward;
  const skNames = rw.skills.map(id => SKILLS_DB_MAP[id]).filter(Boolean)
    .map(s => `<span style="color:${sTierColor(s.tier)}">${esc(s.name)}</span>`).join('、');
  const eqNames = rw.equip.map(e => `<span style="color:${RARITY[e.rarity].color}">${EQUIP_SLOTS[e.slot].name}·${RARITY[e.rarity].name}</span>`).join('、');
  openModal(`
    <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    <h3 style="margin:0">第${ch}章 · ${esc(d.title)}</h3></div>
    <p style="margin:2px 0;font-size:12px;color:rgba(241,239,232,0.7)">${esc(d.plot)}</p>
    <p style="margin:2px 0 8px;font-size:12px;color:rgba(241,239,232,0.55)">${esc(d.realmName)} · 功法${d.tierName} · 装备${d.rarityName} · 进度 ${cleared}/10 ${player.storyRewardClaimed[ch] ? '· 已领奖' : ''}</p>
    <div class="equip-sec-title">十关挑战</div>
    <div class="bag-list">${rows.join('')}</div>
    <div class="equip-sec-title">通关奖励（三选一）</div>
    <p style="margin:4px 0;font-size:12px;color:rgba(241,239,232,0.7)">功法：${skNames}<br>装备：${eqNames}</p>
    <button class="btn-full" onclick="storyBackVol()" style="margin-top:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">返回章节列表</button>`);
}

// ===== 章节通关三选一奖励 =====
function showStoryReward(ch) {
  const rw = STORY_BY_CH[ch].reward;
  _selSkill = rw.skills[0];
  _selEquip = 0;
  const skillCards = rw.skills.map(id => {
    const s = SKILLS_DB_MAP[id]; if (!s) return '';
    return `<div class="reward-card" data-kind="skill" data-id="${id}" onclick="storySelReward('skill','${id}')">
      <div style="color:${sTierColor(s.tier)};font-weight:700">${s.tierName}·${esc(s.name)}</div>
      <div style="font-size:11px;color:rgba(241,239,232,0.6)">${esc(s.schoolCn)} · ${s.cost}灵</div>
      <div style="font-size:11px;color:rgba(241,239,232,0.5)">${esc(s.desc)}</div>
    </div>`;
  }).join('');
  const eqCards = rw.equip.map((e, i) => {
    const r = RARITY[e.rarity], slot = EQUIP_SLOTS[e.slot];
    return `<div class="reward-card" data-kind="equip" data-i="${i}" onclick="storySelReward('equip',${i})">
      <div style="color:${r.color};font-weight:700">${r.name}·${slot.name}</div>
      <div style="font-size:11px;color:rgba(241,239,232,0.6)">${slot.icon} 部位</div>
      <div style="font-size:11px;color:rgba(241,239,232,0.5)">随机属性随境界生成</div>
    </div>`;
  }).join('');
  openModal(`
    <div class="hub-modal-title"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M12 2l3 7 7 .5-5.5 4.5 2 7L12 17l-6.5 4 2-7L2 9.5 9 9z"/></svg>
    <h3 style="margin:0">第${ch}章通关 · 奖励三选一</h3></div>
    <p style="margin:2px 0 8px;font-size:12px;color:rgba(241,239,232,0.7)">功法与装备各选一项（默认选中第一项），确认后领取。</p>
    <div class="equip-sec-title">功法（选 1）</div>
    <div class="reward-grid" id="reward-skills">${skillCards}</div>
    <div class="equip-sec-title">装备（选 1）</div>
    <div class="reward-grid" id="reward-equips">${eqCards}</div>
    <button class="btn-full" onclick="storyClaimReward(${ch})" style="margin-top:14px;background:#D4A843;color:#1a1a1a;font-weight:700;border:none">确认领取</button>
    <button class="btn-full" onclick="storySkipReward(${ch})" style="margin-top:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">暂不选（回本章再领）</button>`);
  setTimeout(() => { highlightReward('skill', rw.skills[0]); highlightReward('equip', 0); }, 0);
}

function storySelReward(kind, val) {
  if (kind === 'skill') _selSkill = val; else _selEquip = val;
  highlightReward(kind, val);
}
function highlightReward(kind, val) {
  const grid = document.getElementById(kind === 'skill' ? 'reward-skills' : 'reward-equips');
  if (!grid) return;
  grid.querySelectorAll('.reward-card').forEach(c => {
    const match = kind === 'skill' ? c.dataset.id === val : (+c.dataset.i === +val);
    c.classList.toggle('reward-sel', match);
  });
}

function storyClaimReward(ch) {
  const rw = STORY_BY_CH[ch].reward;
  const sid = _selSkill || rw.skills[0];
  if (!player.learned.includes(sid)) player.learned.push(sid);   // 功法入功法库
  const eq = rw.equip[_selEquip] || rw.equip[0];
  player.bag.push(genEquip(eq.slot, eq.rarity));                 // 装备入背包
  player.storyRewardClaimed[ch] = true;
  saveGame();
  const sName = SKILLS_DB_MAP[sid] ? SKILLS_DB_MAP[sid].name : sid;
  const r = RARITY[eq.rarity], slot = EQUIP_SLOTS[eq.slot];
  openModal(`<h3 style="color:#D4A843">领取成功</h3>
    <p style="color:rgba(241,239,232,0.8)">功法《${esc(sName)}》已入功法库。<br>获得装备 ${esc(r.name)}·${esc(slot.name)}，已入背包。</p>
    <button class="btn-full" onclick="openChapter(${ch})" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">返回本章</button>`);
}
function storySkipReward(ch) { openChapter(ch); }   // 不标记已领，下次进入本章仍会提示

// 暴露给 onclick（HTML 内联）与 battle.js（脚本级直接调用亦可）
window.openStoryScreen = openStoryScreen;
window.openChapter = openChapter;
window.storySetVol = storySetVol;
window.storyEnterChapter = storyEnterChapter;
window.storyClose = storyClose;
window.storyBackVol = storyBackVol;
window.storySelReward = storySelReward;
window.storyClaimReward = storyClaimReward;
window.storySkipReward = storySkipReward;
window.startStoryBattle = startStoryBattle;

</script>
<script>
/* main.js — 启动入口：存档恢复判定 + 首帧渲染
 * 由 index.html 拆分而来。加载顺序见 index.html 底部 <script> 列表，勿随意调整。
 * 注意：顶层 const/let 跨文件可直接引用，但不会挂到 window（详见 PROJECT.md 坑点 8.1）。
 */
// 检查是否有已存档（跳过创建）
function checkSavedCharacter() {
  try {
    const saved = JSON.parse(localStorage.getItem('wuxia_save'));
    if (saved && saved.name && saved.avatarImg) {
      player.name = saved.name;
      player.sect = saved.sect || '';
      player.avatarId = saved.avatarId || '';
      player.xp = saved.xp || 0;
      player.score = saved.score || 0;
      // 恢复 6 项属性与已分配点数
      player.con = saved.con || 10; player.str = saved.str || 10;
      player.sou = saved.sou || 10; player.spd = saved.spd || 10;
      player.com = saved.com || 10; player.des = saved.des || 10;
      player.spent = saved.spent || 0;
      // 恢复功法：过滤掉旧版/不存在的 id；装备槽同样过滤并截断至上限
      const _learned = (saved.learned && saved.learned.length) ? saved.learned.filter(id => typeof SKILLS_DB_MAP !== 'undefined' && SKILLS_DB_MAP[id]) : [];
      player.learned = _learned.length ? _learned : DEFAULT_LEARNED.slice();
      const _eq2 = (saved.equippedSkills && saved.equippedSkills.length) ? saved.equippedSkills.filter(id => typeof SKILLS_DB_MAP !== 'undefined' && SKILLS_DB_MAP[id] && player.learned.includes(id)) : [];
      player.equippedSkills = _eq2.length ? _eq2.slice(0, MAX_EQUIPPED) : DEFAULT_EQUIPPED.slice();
      player.lastSeen = saved.lastSeen || Date.now();
      // 恢复装备 / 背包 / 灵石（旧存档可能缺字段，补默认）
      const _eq = (saved.equipment && typeof saved.equipment === 'object') ? saved.equipment : {};
      player.equipment = { weapon: _eq.weapon || null, armor: _eq.armor || null, accessory: _eq.accessory || null, boots: _eq.boots || null };
      player.bag = Array.isArray(saved.bag) ? saved.bag : [];
      player.gold = (saved.gold != null) ? saved.gold : 50;
      // 恢复剧情副本进度（旧存档可能缺字段，补默认）
      player.storyCleared = (saved.storyCleared && typeof saved.storyCleared === 'object') ? saved.storyCleared : {};
      player.storyRewardClaimed = (saved.storyRewardClaimed && typeof saved.storyRewardClaimed === 'object') ? saved.storyRewardClaimed : {};
      const _all = CHARACTERS.male.concat(CHARACTERS.female);
      const _ch = _all.find(c => c.id === saved.avatarId);
      art.hero.src = _ch ? _ch.img : saved.avatarImg;
      art.hero.failed = false;
      recalcStats(player);
      // 离线挂机结算（按离开时长累加修为，并回满气血）
      const offlineGain = applyOfflineXp();
      player.hp = player.maxHp; player.mp = player.maxMp;
      // 立即同步主页境界/进度条（不等 initHub）
      if (window.syncRealmDOM) syncRealmDOM();
      createScreen.setAttribute('hidden', '');
      // 有存档 → 初始化并进入主页
      initHub();
      window.HUB.show();
      if (offlineGain > 0) openModal(`<h3 style="color:#D4A843">离线挂机结算</h3><p style="color:rgba(241,239,232,0.8)">离线期间自动修炼，获得修为 <b style="color:#639922">+${formatNum(offlineGain)}</b>（含挂机加成 ${Math.round(player.xpBonus * 100)}%）。</p><button class="btn-full" onclick="closeModal()" style="margin-top:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12)">收下</button>`);
      return true;
    }
  } catch(e) {}
  return false;
}

// 初始化：有存档直接进游戏，否则显示创建界面
if (!checkSavedCharacter()) {
  state = 'create'; // 新状态阻止 canvas 渲染游戏
  createScreen.removeAttribute('hidden');
  // Canvas 渲染一个暗色占位
  function renderCreateBg() {
    if (createScreen.hidden) return;
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
    requestAnimationFrame(renderCreateBg);
  }
  renderCreateBg();
}
setButtons(false); // 地图阶段禁用战斗指令
render();

</script>
<script>
// 在线层（渐进增强）：账号 + 云端存档 + 排行榜。
// 依赖：assets/vendor/tcb.js（全局 tcb）、config.js（window.CLOUDBASE_ENV）。
// 若未配置环境 ID 或 SDK 未加载，本文件直接 return，游戏保持纯单机。
(function () {
  const ENV = window.CLOUDBASE_ENV;
  const root = document.getElementById('online-root');
  const Online = window.Online = { ready: false, uid: null, char: null };

  if (!ENV || typeof tcb === 'undefined') return; // 离线模式：什么都不做

  // ---------- UI 骨架 ----------
  root.innerHTML = `
    <div class="topbar" id="ob-top">
      <span id="ob-status">连接中…</span>
      <span class="ob-actions">
        <button id="ob-board" disabled>排行榜</button>
        <button id="ob-char" disabled>我的角色</button>
      </span>
    </div>
    <div class="modal" id="ob-modal" hidden>
      <div class="modal-box" id="ob-modal-box"></div>
    </div>`;
  const statusEl = document.getElementById('ob-status');
  const boardBtn = document.getElementById('ob-board');
  const charBtn = document.getElementById('ob-char');
  const modal = document.getElementById('ob-modal');
  const modalBox = document.getElementById('ob-modal-box');

  const openModal = html => { modalBox.innerHTML = html; modal.hidden = false; };
  const closeModal = () => { modal.hidden = true; modalBox.innerHTML = ''; };
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- CloudBase ----------
  const app = tcb.init({ env: ENV });
  const db = app.database();
  const COL = 'characters';

  async function uidOf() {
    const auth = app.auth();
    try { const u = await auth.getUserInfo(); if (u && u.uid) return u.uid; } catch (e) {}
    try { const s = await auth.getLoginState(); if (s && s.uid) return s.uid; } catch (e) {}
    if (auth.currentUser && auth.currentUser.uid) return auth.currentUser.uid;
    return null;
  }
  const loadChar = uid => db.collection(COL).doc(uid).get().then(r => (r.data && r.data[0]) || null);
  const saveChar = char => db.collection(COL).doc(Online.uid).set(char);

  function applyChar(char) {
    Online.char = char;
    const g = window.GAME;
    if (g && g.player) {
      g.player.name = char.name;
      g.player.sect = char.sect;
      g.player.score = char.score || 0;
    }
    statusEl.textContent = '已登录：' + char.name + '（' + char.sect + '）';
  }

  function showCreate() {
    const sects = ['少林', '武当', '峨眉', '华山', '丐帮', '明教'];
    openModal(`
      <h3>创建你的侠客</h3>
      <label>侠客名<input id="ob-name" maxlength="8" placeholder="起个名号"></label>
      <label>门派<select id="ob-sect">${sects.map(s => `<option>${s}</option>`).join('')}</select></label>
      <button id="ob-create">踏入江湖</button>`);
    document.getElementById('ob-create').onclick = () => {
      const name = (document.getElementById('ob-name').value || '').trim() || '无名侠客';
      const sect = document.getElementById('ob-sect').value;
      const char = { name, sect, score: 0, createdAt: Date.now() };
      saveChar(char)
        .then(() => { applyChar(char); closeModal(); boardBtn.disabled = false; charBtn.disabled = false; })
        .catch(e => { statusEl.textContent = '创建失败（单机模式）'; console.warn('[online]', e); });
    };
  }

  // 对外接口：战斗胜利后由游戏调用，上报累计分数
  Online.onProgress = function (score) {
    if (!Online.uid || !Online.char) return;
    Online.char.score = score;
    saveChar({ name: Online.char.name, sect: Online.char.sect, score, updatedAt: Date.now() })
      .catch(e => console.warn('[online] 存档失败', e));
  };

  // 排行榜
  boardBtn.onclick = () => {
    db.collection(COL).orderBy('score', 'desc').limit(50).get().then(r => {
      const list = (r.data || []).filter(d => d.score > 0).slice(0, 50);
      openModal(`<h3>江湖排行榜</h3>` + (list.length
        ? `<ol class="board">${list.map(d => `<li><b>${esc(d.name)}</b> · ${esc(d.sect || '')} — ${CULTIVATION.realmFromXp(d.score).label}（修为 ${d.score}）</li>`).join('')}</ol>`
        : `<p>暂无战绩，快去扬名立万！</p>`) + `<button id="ob-close">关闭</button>`);
      document.getElementById('ob-close').onclick = closeModal;
    }).catch(e => openModal(`<p>排行榜加载失败：${(e && e.message) || e}</p><button id="ob-close">关闭</button>`));
  };
  charBtn.onclick = () => {
    if (!Online.char) return;
    openModal(`<h3>我的侠客</h3><p>名号：${esc(Online.char.name)}</p><p>门派：${esc(Online.char.sect)}</p><p>境界：${CULTIVATION.realmFromXp(Online.char.score || 0).label}</p><p>修为：${Online.char.score || 0}</p><button id="ob-close">关闭</button>`);
    document.getElementById('ob-close').onclick = closeModal;
  };

  // ---------- 启动 ----------
  app.auth().signInAnonymously()
    .then(() => uidOf())
    .then(uid => { Online.uid = uid; return loadChar(uid); })
    .then(char => {
      if (char) { applyChar(char); boardBtn.disabled = false; charBtn.disabled = false; }
      else { showCreate(); }
    })
    .catch(e => { statusEl.textContent = '联网失败（单机模式）'; console.warn('[online]', e); });
})();

</script>
